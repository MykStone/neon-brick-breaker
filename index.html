<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StoneBuilt Arcade - Neon Breaker Suite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060810;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 700px;
      background: radial-gradient(circle at center, #11152a 0%, #060810 100%);
      border: 2px solid #00f0ff44;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      display: flex;
      flex-direction: column;
    }
    #ui-bar {
      height: 48px;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6, 8, 16, 0.95);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 10;
    }
    .hud-val {
      color: #00f0ff;
      font-family: monospace;
      font-size: 15px;
    }
    .hud-btn {
      background: #1a233a;
      border: 1px solid #00f0ff55;
      color: #00f0ff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      height: 652px;
      display: block;
      cursor: crosshair;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 8, 16, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 100;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 16px #00f0ff;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .brand-sub {
      font-size: 10px;
      color: #ff007f;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 24px;
      font-weight: bold;
    }
    .mode-select-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 15px;
    }
    .btn-action {
      background: linear-gradient(135deg, #161e36, #0e1324);
      border: 2px solid #00f0ff88;
      color: #fff;
      padding: 16px 18px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.1s, border-color 0.2s, background 0.2s;
      width: 100%;
    }
    .btn-action:hover {
      border-color: #00f0ff;
      background: linear-gradient(135deg, #1e294b, #121930);
    }
    .btn-action:active {
      transform: scale(0.97);
    }
    .btn-retro {
      border-color: #ff007f88;
    }
    .btn-retro:hover {
      border-color: #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
    }
    .btn-swarm {
      border-color: #00f0ff88;
    }
    .btn-swarm:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .mode-title {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .mode-desc {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.4;
    }
    .gameover-score {
      font-size: 34px;
      font-weight: bold;
      color: #ffe600;
      font-family: monospace;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div>SCORE: <span id="score-display" class="hud-val">0</span></div>
      <div id="mid-stat">MODE: <span id="mode-display" class="hud-val">ARCADE</span></div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="speed-btn" class="hud-btn" style="display:none;" onclick="toggleSpeed()">1X</button>
        <button class="hud-btn" onclick="openMenu()">MENU</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="460" height="652"></canvas>

    <!-- Overlay Menu -->
    <div id="overlay">
      <div class="brand-sub">StoneBuilt Entertainment Presents</div>
      <h1 id="overlay-title">Neon Breaker</h1>
      <p id="overlay-msg" style="color: #94a3b8; margin-bottom: 20px; font-size: 13px;">Choose Your Arcade Experience</p>

      <!-- Main Menu Buttons -->
      <div id="menu-view" class="mode-select-box">
        <button class="btn-action btn-retro" onclick="handleStartRetro()">
          <div class="mode-title" style="color: #ff007f;">🕹️ CLASSIC RETRO</div>
          <div class="mode-desc">Paddle controls, falling lasers & multiball power-ups, 80s arcade physics.</div>
        </button>

        <button class="btn-action btn-swarm" onclick="handleStartSwarm()">
          <div class="mode-title" style="color: #00f0ff;">⚡ MODERN SWARM</div>
          <div class="mode-desc">Drag to aim, launch streams of 30+ balls, blast high-HP bricks & TNT blocks.</div>
        </button>
      </div>

      <!-- Game Over View -->
      <div id="gameover-view" style="display:none; width: 100%; max-width: 300px;">
        <div class="gameover-score" id="final-score-display">0</div>
        <button class="btn-action btn-swarm" style="text-align:center; font-weight:bold; margin-bottom:10px;" onclick="handlePlayAgain()">
          PLAY AGAIN
        </button>
        <button class="btn-action" style="text-align:center;" onclick="handleBackToMenu()">
          BACK TO MENU
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- SYNTHESIZED AUDIO (Web Audio API) ---
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.08, vol = 0.1) {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const sndHit = (f = 450) => playBeep(f, 'triangle', 0.06, 0.12);
    const sndPaddle = () => playBeep(380, 'sine', 0.08, 0.15);
    const sndLaser = () => playBeep(880, 'sawtooth', 0.09, 0.08);
    const sndPower = () => playTone(740, 'square', 0.16, 0.1);
    const sndBomb = () => playTone(110, 'sawtooth', 0.35, 0.22);
    const sndDie = () => playTone(140, 'sawtooth', 0.4, 0.15);

    // --- DOM REFERENCES ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const menuView = document.getElementById('menu-view');
    const gameoverView = document.getElementById('gameover-view');
    const finalScoreDisplay = document.getElementById('final-score-display');
    const scoreDisplay = document.getElementById('score-display');
    const modeDisplay = document.getElementById('mode-display');
    const midStat = document.getElementById('mid-stat');
    const speedBtn = document.getElementById('speed-btn');

    const W = 460;
    const H = 652;

    // --- MASTER ENGINE STATE ---
    let gameState = 'MENU'; // 'MENU', 'PLAYING_RETRO', 'PLAYING_SWARM'
    let score = 0;
    let particles = [];

    // =====================================
    // 1. CLASSIC RETRO ENGINE
    // =====================================
    const retro = {
      lives: 3,
      level: 1,
      paddle: { w: 85, h: 12, x: 187, y: 620, hasLasers: false },
      balls: [],
      bricks: [],
      powerUps: [],
      lasers: []
    };

    function startRetroGame() {
      gameState = 'PLAYING_RETRO';
      modeDisplay.textContent = 'RETRO';
      speedBtn.style.display = 'none';
      score = 0;
      retro.lives = 3;
      retro.level = 1;
      scoreDisplay.textContent = score;
      midStat.innerHTML = `LIVES: <span style="color:#ff007f;">❤️❤️❤️</span>`;
      initRetroBricks();
      resetRetroBall();
    }

    function initRetroBricks() {
      retro.bricks = [];
      const cols = 7, rows = 6;
      const padding = 6;
      const bW = (W - (padding * (cols + 1))) / cols;
      const bH = 16;
      const colors = ['#ff007f', '#ff5500', '#ffe600', '#39ff14', '#00f0ff', '#b026ff'];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          retro.bricks.push({
            x: padding + c * (bW + padding),
            y: 40 + r * (bH + padding),
            w: bW,
            h: bH,
            color: colors[r % colors.length],
            hp: (retro.level >= 2 && r === 0) ? 2 : 1,
            alive: true
          });
        }
      }
    }

    function resetRetroBall() {
      retro.paddle.w = 85;
      retro.paddle.hasLasers = false;
      retro.paddle.x = (W - 85) / 2;
      retro.balls = [{
        x: W / 2,
        y: H - 45,
        vx: 3.5 * (Math.random() > 0.5 ? 1 : -1),
        vy: -5,
        r: 6,
        stuck: true
      }];
    }

    // =====================================
    // 2. MODERN SWARM ENGINE
    // =====================================
    const swarm = {
      level: 1,
      ballCount: 15,
      balls: [],
      bricks: [],
      pickups: [],
      shooter: { x: W / 2, y: H - 25 },
      aiming: false,
      aimAngle: -Math.PI / 2,
      launching: false,
      launchTimer: 0,
      launchedCount: 0,
      ballsReturned: 0,
      newShooterX: null,
      speedMultiplier: 1
    };

    function startSwarmGame() {
      gameState = 'PLAYING_SWARM';
      modeDisplay.textContent = 'SWARM';
      speedBtn.style.display = 'block';
      speedBtn.textContent = '1X';
      swarm.speedMultiplier = 1;
      score = 0;
      swarm.level = 1;
      swarm.ballCount = 15;
      swarm.balls = [];
      swarm.shooter.x = W / 2;
      swarm.shooter.y = H - 25;
      scoreDisplay.textContent = score;
      midStat.innerHTML = `BALLS: <span class="hud-val">${swarm.ballCount}</span>`;
      swarm.bricks = [];
      swarm.pickups = [];
      addSwarmWave();
      addSwarmWave();
      addSwarmWave();
    }

    function addSwarmWave() {
      const cols = 7;
      const padding = 6;
      const bW = (W - (padding * (cols + 1))) / cols;
      const bH = 26;

      for (let b of swarm.bricks) b.row++;
      for (let p of swarm.pickups) p.row++;

      for (let c = 0; c < cols; c++) {
        const rand = Math.random();
        if (rand < 0.45) {
          const hp = Math.max(1, Math.round(swarm.level * (1 + Math.random() * 1.4)));
          const isTNT = Math.random() < 0.12;
          swarm.bricks.push({
            c: c,
            row: 1,
            w: bW,
            h: bH,
            hp: hp,
            isTNT: isTNT,
            alive: true
          });
        } else if (rand < 0.62) {
          swarm.pickups.push({
            c: c,
            row: 1,
            w: bW,
            h: bH,
            collected: false
          });
        }
      }
    }

    // =====================================
    // PARTICLES
    // =====================================
    function spawnSparks(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          r: Math.random() * 2.5 + 1,
          color: color,
          life: 1
        });
      }
    }

    // =====================================
    // TOUCH & POINTER INPUTS
    // =====================================
    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function onPointerMove(clientX, clientY) {
      if (gameState === 'MENU') return;
      const pt = getCanvasPos(clientX, clientY);

      if (gameState === 'PLAYING_RETRO') {
        retro.paddle.x = Math.max(0, Math.min(W - retro.paddle.w, pt.x - retro.paddle.w / 2));
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].x = retro.paddle.x + retro.paddle.w / 2;
        }
      } else if (gameState === 'PLAYING_SWARM' && !swarm.launching) {
        if (pt.y < swarm.shooter.y - 15) {
          swarm.aiming = true;
          swarm.aimAngle = Math.atan2(pt.y - swarm.shooter.y, pt.x - swarm.shooter.x);
        }
      }
    }

    function onPointerUp() {
      if (gameState === 'MENU') return;

      if (gameState === 'PLAYING_RETRO') {
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].stuck = false;
          sndPaddle();
        }
        if (retro.paddle.hasLasers) {
          sndLaser();
          retro.lasers.push({ x: retro.paddle.x + 8, y: retro.paddle.y - 4, vy: -9 });
          retro.lasers.push({ x: retro.paddle.x + retro.paddle.w - 8, y: retro.paddle.y - 4, vy: -9 });
        }
      } else if (gameState === 'PLAYING_SWARM') {
        if (swarm.aiming && !swarm.launching) {
          swarm.aiming = false;
          swarm.launching = true;
          swarm.launchedCount = 0;
          swarm.ballsReturned = 0;
          swarm.launchTimer = 0;
          swarm.balls = [];
          swarm.newShooterX = null;
        }
      }
    }

    canvas.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    });

    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchend', onPointerUp);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') onPointerUp();
      if (gameState === 'PLAYING_RETRO') {
        if (e.code === 'ArrowLeft') retro.paddle.x = Math.max(0, retro.paddle.x - 30);
        if (e.code === 'ArrowRight') retro.paddle.x = Math.min(W - retro.paddle.w, retro.paddle.x + 30);
      }
    });

    function toggleSpeed() {
      if (swarm.speedMultiplier === 1) {
        swarm.speedMultiplier = 2;
        speedBtn.textContent = '2X';
      } else if (swarm.speedMultiplier === 2) {
        swarm.speedMultiplier = 3;
        speedBtn.textContent = '3X';
      } else {
        swarm.speedMultiplier = 1;
        speedBtn.textContent = '1X';
      }
    }

    function triggerGameOver(modeName) {
      gameState = 'MENU';
      overlay.style.display = 'flex';
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ff007f';
      overlayMsg.textContent = `${modeName} FINAL SCORE`;
      menuView.style.display = 'none';
      gameoverView.style.display = 'block';
      finalScoreDisplay.textContent = score;
    }

    // =====================================
    // UPDATE ENGINES
    // =====================================
    function updateRetro() {
      retro.paddle.y = H - 28;

      // Lasers
      for (let i = retro.lasers.length - 1; i >= 0; i--) {
        const l = retro.lasers[i];
        l.y += l.vy;
        if (l.y < 0) { retro.lasers.splice(i, 1); continue; }
        for (let b of retro.bricks) {
          if (b.alive && l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
            b.hp--;
            if (b.hp <= 0) {
              b.alive = false;
              score += 20;
              spawnSparks(b.x + b.w / 2, b.y + b.h / 2, b.color);
            }
            sndHit(750);
            retro.lasers.splice(i, 1);
            break;
          }
        }
      }

      // Balls
      for (let i = retro.balls.length - 1; i >= 0; i--) {
        const b = retro.balls[i];
        if (b.stuck) continue;
        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.r < 0 || b.x + b.r > W) { b.vx *= -1; sndHit(300); }
        if (b.y - b.r < 0) { b.vy *= -1; sndHit(300); }

        // Paddle
        if (b.y + b.r >= retro.paddle.y && b.y - b.r <= retro.paddle.y + retro.paddle.h && b.x >= retro.paddle.x && b.x <= retro.paddle.x + retro.paddle.w && b.vy > 0) {
          sndPaddle();
          const hit = (b.x - (retro.paddle.x + retro.paddle.w / 2)) / (retro.paddle.w / 2);
          const spd = Math.hypot(b.vx, b.vy);
          b.vx = hit * 6;
          b.vy = -Math.abs(Math.sqrt(Math.max(16, spd * spd - b.vx * b.vx)));
          b.y = retro.paddle.y - b.r;
        }

        // Bricks
        for (let brk of retro.bricks) {
          if (!brk.alive) continue;
          if (b.x + b.r > brk.x && b.x - b.r < brk.x + brk.w && b.y + b.r > brk.y && b.y - b.r < brk.y + brk.h) {
            brk.hp--;
            if (brk.hp <= 0) {
              brk.alive = false;
              score += 15;
              spawnSparks(brk.x + brk.w / 2, brk.y + brk.h / 2, brk.color);
              if (Math.random() < 0.22) {
                const types = ['MULTI', 'LASER', 'WIDE'];
                retro.powerUps.push({
                  x: brk.x + brk.w / 2,
                  y: brk.y + brk.h / 2,
                  type: types[Math.floor(Math.random() * types.length)],
                  vy: 2.2
                });
              }
            }
            sndHit(520);
            b.vy *= -1;
            break;
          }
        }

        if (b.y - b.r > H) retro.balls.splice(i, 1);
      }

      // Ball Loss
      if (retro.balls.length === 0) {
        retro.lives--;
        sndDie();
        if (retro.lives <= 0) {
          triggerGameOver('CLASSIC RETRO');
          return;
        } else {
          let str = '';
          for (let l = 0; l < retro.lives; l++) str += '❤️';
          midStat.innerHTML = `LIVES: <span style="color:#ff007f;">${str}</span>`;
          resetRetroBall();
        }
      }

      // Power-ups
      for (let i = retro.powerUps.length - 1; i >= 0; i--) {
        const p = retro.powerUps[i];
        p.y += p.vy;
        if (p.y >= retro.paddle.y && p.y <= retro.paddle.y + retro.paddle.h && p.x >= retro.paddle.x && p.x <= retro.paddle.x + retro.paddle.w) {
          sndPower();
          if (p.type === 'WIDE') {
            retro.paddle.w = 125;
            setTimeout(() => { retro.paddle.w = 85; }, 9000);
          } else if (p.type === 'LASER') {
            retro.paddle.hasLasers = true;
          } else if (p.type === 'MULTI' && retro.balls[0]) {
            retro.balls.push({ x: retro.balls[0].x, y: retro.balls[0].y, vx: -3, vy: -4, r: 6, stuck: false });
            retro.balls.push({ x: retro.balls[0].x, y: retro.balls[0].y, vx: 3, vy: -4, r: 6, stuck: false });
          }
          retro.powerUps.splice(i, 1);
        } else if (p.y > H) retro.powerUps.splice(i, 1);
      }

      // Next level
      if (retro.bricks.length > 0 && retro.bricks.every(b => !b.alive)) {
        retro.level++;
        initRetroBricks();
        resetRetroBall();
      }

      scoreDisplay.textContent = score;
    }

    function updateSwarm() {
      const padding = 6;
      const cols = 7;
      const bW = (W - (padding * (cols + 1))) / cols;
      const bH = 26;

      // Launch stream
      if (swarm.launching && swarm.launchedCount < swarm.ballCount) {
        swarm.launchTimer++;
        if (swarm.launchTimer % 4 === 0) {
          const spd = 8.5;
          swarm.balls.push({
            x: swarm.shooter.x,
            y: swarm.shooter.y,
            vx: Math.cos(swarm.aimAngle) * spd,
            vy: Math.sin(swarm.aimAngle) * spd,
            r: 4.5
          });
          swarm.launchedCount++;
        }
      }

      for (let step = 0; step < swarm.speedMultiplier; step++) {
        for (let i = swarm.balls.length - 1; i >= 0; i--) {
          const b = swarm.balls[i];
          b.x += b.vx;
          b.y += b.vy;

          if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; }
          if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; }
          if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; }

          // Brick hit
          for (let brk of swarm.bricks) {
            if (!brk.alive) continue;
            const bx = padding + brk.c * (bW + padding);
            const by = 40 + brk.row * (bH + padding);

            if (b.x + b.r > bx && b.x - b.r < bx + bW && b.y + b.r > by && b.y - b.r < by + bH) {
              brk.hp--;
              score++;
              sndHit(400 + Math.min(400, brk.hp * 10));

              // TNT explosion
              if (brk.isTNT && brk.hp <= 0) {
                sndBomb();
                spawnSparks(bx + bW / 2, by + bH / 2, '#ff5500', 25);
                for (let other of swarm.bricks) {
                  if (other.alive && Math.abs(other.c - brk.c) <= 1 && Math.abs(other.row - brk.row) <= 1) {
                    other.hp -= 25;
                    if (other.hp <= 0) other.alive = false;
                  }
                }
              }

              if (brk.hp <= 0) {
                brk.alive = false;
                spawnSparks(bx + bW / 2, by + bH / 2, '#00f0ff', 12);
              }
              b.vy *= -1;
              break;
            }
          }

          // Pickups
          for (let p of swarm.pickups) {
            if (p.collected) continue;
            const px = padding + p.c * (bW + padding) + bW / 2;
            const py = 40 + p.row * (bH + padding) + bH / 2;
            if (Math.hypot(b.x - px, b.y - py) < 14) {
              p.collected = true;
              swarm.ballCount++;
              sndPower();
              spawnSparks(px, py, '#39ff14', 10);
            }
          }

          // Return to floor
          if (b.y + b.r >= H - 15) {
            if (swarm.newShooterX === null) swarm.newShooterX = b.x;
            swarm.balls.splice(i, 1);
            swarm.ballsReturned++;
          }
        }
      }

      // Turn finish
      if (swarm.launching && swarm.ballsReturned >= swarm.ballCount) {
        swarm.launching = false;
        swarm.shooter.x = Math.max(25, Math.min(W - 25, swarm.newShooterX || W / 2));
        swarm.level++;
        addSwarmWave();
        midStat.innerHTML = `BALLS: <span class="hud-val">${swarm.ballCount}</span>`;

        // Check if bricks reached bottom
        for (let b of swarm.bricks) {
          if (b.alive && b.row >= 18) {
            triggerGameOver('MODERN SWARM');
            return;
          }
        }
      }

      scoreDisplay.textContent = score;
    }
