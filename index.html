<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StoneBuilt Arcade - Neon Breaker Suite 2.0</title>
  
  <!-- CrazyGames SDK v3 Universal -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #03050c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }
    #cabinet {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 780px;
      background: radial-gradient(circle at center, #0a1128 0%, #03050c 100%);
      border: 2px solid #00f0ff55;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1);
      display: flex;
      flex-direction: column;
    }
    /* Larger, Spacious Top HUD */
    #top-hud {
      height: 64px;
      width: 100%;
      padding: 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090e21;
      border-bottom: 2px solid #00f0ff44;
      z-index: 10;
    }
    .hud-stat-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .hud-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 900;
    }
    .hud-accent {
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
    .hud-gold {
      color: #ffe600;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
    }
    .hud-tokens {
      color: #ff007f;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }
    .hud-btn-group {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .hud-ctrl-btn {
      background: #121c3b;
      border: 1.5px solid #00f0ff66;
      color: #00f0ff;
      min-width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .hud-ctrl-btn:active {
      background: #00f0ff;
      color: #080b16;
      transform: scale(0.95);
    }
    #canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    /* Tactile Bottom Action Bar with Recall Button */
    #swarm-action-bar {
      position: absolute;
      bottom: 10px;
      left: 12px;
      right: 12px;
      display: none;
      justify-content: space-between;
      gap: 8px;
      z-index: 50;
    }
    .power-btn {
      flex: 1;
      background: rgba(10, 17, 40, 0.92);
      border: 1.8px solid;
      border-radius: 10px;
      padding: 10px 8px;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    }
    .power-btn:active {
      transform: scale(0.96);
    }
    .btn-recall {
      border-color: #ffe600;
      color: #ffe600;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
      display: none; /* Only visible when balls are in flight! */
    }
    .btn-nuke {
      border-color: #ff007f;
      color: #ff007f;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }
    .btn-surge {
      border-color: #00f0ff;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
    #overlay, #gameover-screen, #pause-screen {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 12, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    .brand-eyebrow {
      font-size: 11px;
      font-weight: 800;
      color: #ff007f;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 10px #ff007f;
    }
    .main-title {
      font-size: 32px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff, 0 0 40px rgba(0,240,255,0.4);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .menu-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .menu-button-stack {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .menu-card-btn {
      background: #090e1f;
      border: 2px solid;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      display: block;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .menu-card-btn:active {
      transform: scale(0.97);
    }
    .card-retro {
      border-color: #ff007f;
    }
    .card-retro:hover {
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
    }
    .card-swarm {
      border-color: #00f0ff;
    }
    .card-swarm:hover {
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
    }
    .btn-header {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .btn-body {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .gameover-val {
      font-size: 42px;
      font-weight: 900;
      color: #ffe600;
      font-family: monospace;
      margin-bottom: 6px;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.5);
    }
    .hi-score-tag {
      font-size: 13px;
      color: #00f0ff;
      font-family: monospace;
      margin-bottom: 16px;
    }
    .action-btn {
      background: #00f0ff;
      color: #060810;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
      margin-bottom: 10px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .action-btn:active {
      transform: scale(0.97);
    }
    .revive-btn {
      background: #ff007f;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
      margin-bottom: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      display: none;
    }
    .sub-action-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
    }
  </style>
</head>
<body>

  <div id="cabinet">
    <!-- Spacious, Big Top HUD -->
    <div id="top-hud">
      <div class="hud-stat-group">
        <div class="hud-badge">🏆 <span id="hud-score" class="hud-accent">0</span></div>
        <div class="hud-badge">👑 <span id="hud-best" class="hud-gold">0</span></div>
        <div class="hud-badge">🪙 <span id="hud-tokens" class="hud-tokens">0</span></div>
        <div class="hud-badge">LVL: <span id="hud-level" class="hud-gold">1</span></div>
      </div>
      <div class="hud-btn-group">
        <button id="hud-pause-btn" class="hud-ctrl-btn" title="Pause Game">⏸️</button>
        <button id="hud-music-btn" class="hud-ctrl-btn" title="Toggle Synthwave">🎵</button>
        <button id="hud-mute-btn" class="hud-ctrl-btn" title="Toggle SFX">🔊</button>
        <button id="hud-menu-btn" class="hud-ctrl-btn" style="min-width: 50px;">MENU</button>
      </div>
    </div>

    <!-- Playfield Canvas Area -->
    <div id="canvas-wrap">
      <canvas id="gameCanvas" width="460" height="700"></canvas>

      <!-- Tactile Bottom Action Bar (Swarm Mode) -->
      <div id="swarm-action-bar">
        <button id="btn-swarm-recall" class="power-btn btn-recall">⬇️ RECALL BALLS</button>
        <button id="btn-power-nuke" class="power-btn btn-nuke">⚡ EMP NUKE (10🪙)</button>
        <button id="btn-power-surge" class="power-btn btn-surge">🚀 +10 BALLS (15🪙)</button>
      </div>

      <!-- Main Menu Screen -->
      <div id="overlay">
        <div class="brand-eyebrow">StoneBuilt Entertainment</div>
        <div class="main-title">Neon Breaker</div>
        <div class="menu-sub">StoneBuilt 2.0 Arcade Edition</div>

        <div class="menu-button-stack">
          <button id="btn-retro" class="menu-card-btn card-retro">
            <div class="btn-header" style="color:#ff007f;">🕹️ CLASSIC CAMPAIGN</div>
            <div class="btn-body">Infinite procedural sectors, mega plasma cutting beam, kinetic heat fireball.</div>
          </button>

          <button id="btn-swarm" class="menu-card-btn card-swarm">
            <div class="btn-header" style="color:#00f0ff;">⚡ MODERN SWARM ARENA</div>
            <div class="btn-body">Bank-shot reflection aim, instant recall, and high-scaled brick HP.</div>
          </button>
        </div>
      </div>

      <!-- Pause Screen -->
      <div id="pause-screen" style="display:none;">
        <div class="brand-eyebrow">GAME PAUSED</div>
        <div class="main-title" style="font-size:26px;">SYSTEM HALTED</div>
        <div class="menu-sub">StoneBuilt Arcade Core</div>
        <button id="btn-resume" class="action-btn">RESUME GAME</button>
        <button id="btn-pause-menu" class="sub-action-btn">ABORT TO MENU</button>
      </div>

      <!-- Game Over Screen -->
      <div id="gameover-screen" style="display:none;">
        <div class="brand-eyebrow" style="color:#ff007f;">RUN COMPLETE</div>
        <div id="gameover-mode-label" class="main-title" style="font-size:22px; color:#fff;">FINAL SCORE</div>
        <div id="gameover-score-val" class="gameover-val">0</div>
        <div id="gameover-best-tag" class="hi-score-tag">ALL-TIME BEST: 0</div>
        
        <button id="btn-revive" class="revive-btn">⚡ REVIVE RUN (WATCH AD)</button>
        <button id="btn-restart" class="action-btn">PLAY AGAIN</button>
        <button id="btn-to-menu" class="sub-action-btn">RETURN TO MENU</button>
      </div>
    </div>
  </div>

  <script>
    /* ==============================================================
       1. CRAZYGAMES SDK v3 INTEGRATION & LIFECYCLE
       ============================================================== */
    let crazyGamesReady = false;
    let isAdPlaying = false;
    let portalMuted = false;
    let userMuted = false;
    let musicEnabled = true;
    let isGamePaused = false;

    function isCrazyGamesEnvironment() {
      if (!window.CrazyGames?.SDK) return false;
      const env = window.CrazyGames.SDK.environment;
      return env === 'crazygames' || env === 'local';
    }

    async function initCrazyGames() {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        try {
          await window.CrazyGames.SDK.init();
          crazyGamesReady = true;

          if (isCrazyGamesEnvironment() && window.CrazyGames.SDK.game?.settings) {
            portalMuted = !!window.CrazyGames.SDK.game.settings.muteAudio;
            enforceAudioPolicy();
          }

          if (isCrazyGamesEnvironment() && window.CrazyGames.SDK.game?.addSettingsChangeListener) {
            window.CrazyGames.SDK.game.addSettingsChangeListener((settings) => {
              portalMuted = !!settings.muteAudio;
              enforceAudioPolicy();
            });
          }
        } catch (e) {}
      }
    }
    initCrazyGames();

    function triggerCrazyGamesStart() {
      if (crazyGamesReady && isCrazyGamesEnvironment() && window.CrazyGames?.SDK?.game?.gameplayStart) {
        try { window.CrazyGames.SDK.game.gameplayStart(); } catch (e) {}
      }
    }

    function triggerCrazyGamesStop() {
      if (crazyGamesReady && isCrazyGamesEnvironment() && window.CrazyGames?.SDK?.game?.gameplayStop) {
        try { window.CrazyGames.SDK.game.gameplayStop(); } catch (e) {}
      }
    }

    function triggerHappyTime() {
      if (crazyGamesReady && isCrazyGamesEnvironment() && window.CrazyGames?.SDK?.game?.happytime) {
        try {
          const res = window.CrazyGames.SDK.game.happytime();
          if (res && res.catch) res.catch(() => {});
        } catch (e) {}
      }
    }

    function triggerCrazyGamesAd(onComplete) {
      if (!crazyGamesReady || !isCrazyGamesEnvironment() || !window.CrazyGames?.SDK?.ad?.requestAd) {
        if (onComplete) onComplete();
        return;
      }

      isAdPlaying = true;
      triggerCrazyGamesStop();
      enforceAudioPolicy();

      let finished = false;
      const finishAd = () => {
        if (finished) return;
        finished = true;
        isAdPlaying = false;
        enforceAudioPolicy();
        if (onComplete) onComplete();
      };

      const safetyTimer = setTimeout(() => { finishAd(); }, 3500);

      const callbacks = {
        adStarted: () => {},
        adFinished: () => { clearTimeout(safetyTimer); finishAd(); },
        adError: () => { clearTimeout(safetyTimer); finishAd(); }
      };

      try {
        window.CrazyGames.SDK.ad.requestAd("midgame", callbacks);
      } catch (e) {
        clearTimeout(safetyTimer);
        finishAd();
      }
    }

    function triggerCrazyGamesRewarded(onRewardGranted, onAdClosed) {
      if (!crazyGamesReady || !isCrazyGamesEnvironment() || !window.CrazyGames?.SDK?.ad?.requestAd) {
        if (onRewardGranted) onRewardGranted();
        return;
      }

      let rewardEarned = false;
      isAdPlaying = true;
      triggerCrazyGamesStop();
      enforceAudioPolicy();

      let finished = false;
      const finishReward = () => {
        if (finished) return;
        finished = true;
        isAdPlaying = false;
        enforceAudioPolicy();
      };

      const safetyTimer = setTimeout(() => {
        finishReward();
        if (onAdClosed) onAdClosed();
      }, 4000);

      const callbacks = {
        adStarted: () => {},
        adFinished: () => {
          clearTimeout(safetyTimer);
          finishReward();
          rewardEarned = true;
          if (onRewardGranted) onRewardGranted();
        },
        adError: () => {
          clearTimeout(safetyTimer);
          finishReward();
          if (onAdClosed && !rewardEarned) onAdClosed();
        }
      };

      try {
        window.CrazyGames.SDK.ad.requestAd("rewarded", callbacks);
      } catch (e) {
        clearTimeout(safetyTimer);
        finishReward();
        if (onAdClosed) onAdClosed();
      }
    }

    /* ==============================================================
       2. LOUDER & PUNCHIER 128 BPM SYNTHWAVE AUDIO ENGINE
       ============================================================== */
    let audioCtx = null;
    let masterGainNode = null;
    let masterCompressor = null;
    let noiseBuffer = null;
    let musicTimer = null;
    let musicStep = 0;

    const BPM = 128;
    const STEP_TIME = (60 / BPM) / 4;
    const BASS_ROOTS = [55, 55, 43.65, 43.65, 65.41, 65.41, 49.00, 49.00];

    function initAudioEngine() {
      if (!audioCtx) {
        try {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioClass();

          masterCompressor = audioCtx.createDynamicsCompressor();
          masterCompressor.threshold.setValueAtTime(-16, audioCtx.currentTime);
          masterCompressor.knee.setValueAtTime(10, audioCtx.currentTime);
          masterCompressor.ratio.setValueAtTime(6, audioCtx.currentTime);
          masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
          masterCompressor.release.setValueAtTime(0.12, audioCtx.currentTime);

          masterGainNode = audioCtx.createGain();
          masterGainNode.connect(masterCompressor);
          masterCompressor.connect(audioCtx.destination);

          buildWhiteNoiseBuffer();
          enforceAudioPolicy();
          startSynthwaveLoop();
        } catch (e) {}
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function buildWhiteNoiseBuffer() {
      const bufferSize = audioCtx.sampleRate * 0.5;
      noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    }

    function enforceAudioPolicy() {
      const shouldMute = isAdPlaying || portalMuted || userMuted || isGamePaused;
      if (masterGainNode && audioCtx) {
        const now = audioCtx.currentTime;
        masterGainNode.gain.setValueAtTime(masterGainNode.gain.value, now);
        masterGainNode.gain.linearRampToValueAtTime(shouldMute ? 0 : 1, now + 0.05);

        if (shouldMute && audioCtx.state === 'running') {
          audioCtx.suspend().catch(() => {});
        } else if (!shouldMute && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      }
      
      const muteBtn = document.getElementById('hud-mute-btn');
      if (muteBtn) {
        muteBtn.textContent = (userMuted || portalMuted) ? '🔇' : '🔊';
      }
    }

    function startSynthwaveLoop() {
      if (musicTimer) clearInterval(musicTimer);
      musicTimer = setInterval(() => {
        if (!musicEnabled || isAdPlaying || userMuted || portalMuted || isGamePaused || gameState === 'MENU') return;
        if (!audioCtx || audioCtx.state !== 'running') return;

        if (musicStep % 4 === 0) play808Kick();
        if (musicStep % 8 === 4) playRealSnare();
        if (musicStep % 2 === 1) playHiHat();
        if (musicStep % 2 === 0) {
          const chordIndex = Math.floor(musicStep / 4) % BASS_ROOTS.length;
          const octave = (musicStep % 4 === 2) ? 2 : 1;
          playWarmMoogBass(BASS_ROOTS[chordIndex] * octave);
        }

        musicStep = (musicStep + 1) % 32;
      }, STEP_TIME * 1000);
    }

    function play808Kick() {
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(155, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + 0.1);
        gain.gain.setValueAtTime(0.48, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(masterGainNode);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

    function playRealSnare() {
      if (!noiseBuffer) return;
      try {
        const now = audioCtx.currentTime;
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(1200, now);
        noiseFilter.Q.setValueAtTime(1.5, now);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.32, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        noiseSource.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(masterGainNode);
        noiseSource.start(now);
        noiseSource.stop(now + 0.18);

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
        oscGain.gain.setValueAtTime(0.24, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(oscGain);
        oscGain.connect(masterGainNode);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function playHiHat() {
      if (!noiseBuffer) return;
      try {
        const now = audioCtx.currentTime;
        const source = audioCtx.createBufferSource();
        source.buffer = noiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(6800, now);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(masterGainNode);
        source.start(now);
        source.stop(now + 0.04);
      } catch (e) {}
    }

    function playWarmMoogBass(freq) {
      try {
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 1.008, now);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.Q.setValueAtTime(5.8, now);
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(320, now + 0.16);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(masterGainNode);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.18);
        osc2.stop(now + 0.18);
      } catch (e) {}
    }

    function playTone(freq, type = 'sine', duration = 0.08, vol = 0.14) {
      if (isAdPlaying || userMuted || portalMuted) return;
      initAudioEngine();
      try {
        const osc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        noteGain.gain.setValueAtTime(vol, audioCtx.currentTime);
        noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(noteGain);
        noteGain.connect(masterGainNode);

    function generateProceduralStage(lvl) {
      retro.bricks = [];
      const cols = 8;
      const rows = Math.min(8, 4 + Math.floor(lvl / 3));
      const pad = 5;
      const bW = (W - (pad * (cols + 1))) / cols;
      const bH = 16;

      let sectorColors = ['#00f0ff', '#ff007f', '#39ff14', '#ffe600'];
      if (lvl > 5) sectorColors = ['#ff007f', '#ffe600', '#b026ff', '#00f0ff'];
      if (lvl > 10) sectorColors = ['#39ff14', '#00f0ff', '#ff5500', '#ffe600'];

      const archetype = lvl % 5;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols / 2; c++) {
          let spawn = true;
          if (archetype === 1 && (c < (rows - r - 2))) spawn = false;
          if (archetype === 2 && (c % 2 === 0 && r > 4)) spawn = false;
          if (archetype === 3 && (r + c < 2 || r - c > 3)) spawn = false;
          if (archetype === 4 && (r === 2 && c === 1)) spawn = false;

          if (spawn) {
            let hp = 1;
            if (lvl >= 2 && r <= 1) hp = 2;
            if (lvl >= 5 && r === 0) hp = 3;

            const color = sectorColors[r % sectorColors.length];
            const xLeft = pad + c * (bW + pad);
            const xRight = pad + (cols - 1 - c) * (bW + pad);
            const y = 45 + r * (bH + pad);

            retro.bricks.push({ x: xLeft, y: y, w: bW, h: bH, hp: hp, maxHp: hp, color: color, alive: true });
            if (xLeft !== xRight) {
              retro.bricks.push({ x: xRight, y: y, w: bW, h: bH, hp: hp, maxHp: hp, color: color, alive: true });
            }
          }
        }
      }
    }

    function addSwarmWave() {
      for (let b of swarm.bricks) b.row++;
      for (let p of swarm.pickups) p.row++;

      let spawnedPickup = false;
      const baseWaveHp = Math.max(3, Math.round(swarm.ballCount * 0.8 + swarm.level * 1.5));

      for (let c = 0; c < SWARM_COLS; c++) {
        const rand = Math.random();
        if (rand < 0.44) {
          let hp = Math.max(1, Math.round(baseWaveHp * (0.8 + Math.random() * 0.4)));
          const isTNT = Math.random() < 0.08;
          const isTriangle = !isTNT && (Math.random() < 0.22);
          const triDir = Math.random() > 0.5 ? 'TL' : 'TR';

          swarm.bricks.push({
            c: c, row: 1, w: SWARM_BW, h: SWARM_BH,
            hp: hp, maxHp: hp, isTNT: isTNT,
            isTriangle: isTriangle, triDir: triDir, alive: true
          });
        } else if (!spawnedPickup && rand < 0.54) {
          spawnedPickup = true;
          swarm.pickups.push({ c: c, row: 1, w: SWARM_BW, h: SWARM_BH, collected: false });
        }
      }
    }

    /* ==============================================================
       6. INPUTS & CONTROLS
       ============================================================== */
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      let cx = e.clientX, cy = e.clientY;
      if (e.touches && e.touches.length > 0) {
        cx = e.touches[0].clientX;
        cy = e.touches[0].clientY;
      }
      return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    function onPointerDown(e) {
      if (isAdPlaying || isGamePaused || gameState === 'MENU') return;
      initAudioEngine();
      const pt = getCanvasCoords(e);

      if (gameState === 'PLAYING_RETRO') {
        retro.paddle.x = Math.max(0, Math.min(W - retro.paddle.w, pt.x - retro.paddle.w / 2));
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].stuck = false;
          sndPaddle();
        }
      } else if (gameState === 'PLAYING_SWARM' && !swarm.launching) {
        updateAimAngle(pt);
      }
    }

    function onPointerMove(e) {
      if (isAdPlaying || isGamePaused || gameState === 'MENU') return;
      const pt = getCanvasCoords(e);

      if (gameState === 'PLAYING_RETRO') {
        retro.paddle.x = Math.max(0, Math.min(W - retro.paddle.w, pt.x - retro.paddle.w / 2));
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].x = retro.paddle.x + retro.paddle.w / 2;
        }

    function onPointerUp() {

    function updateAimAngle(pt) {
      const dx = pt.x - swarm.shooter.x;
      const dy = pt.y - swarm.shooter.y;
      if (dy < -10) {
        let angle = Math.atan2(dy, dx);
        angle = Math.max(-Math.PI * 0.96, Math.min(-Math.PI * 0.04, angle));
        swarm.aimAngle = angle;
        swarm.aiming = true;
      }
    }

    /* ==============================================================
       7. RETRO GAMEPLAY & CONTINUOUS CUTTING LASER LOGIC
       ============================================================== */
    function updateRetroEngine() {
      retro.paddle.y = H - 28;

      if (retro.paddle.hasMegaLaser) {
        retro.paddle.laserTime -= 0.016;
        if (retro.paddle.laserTime <= 0) {
          retro.paddle.hasMegaLaser = false;
        } else {
          if (Math.random() < 0.3) sndLaserBeam();
          const beamX = retro.paddle.x + retro.paddle.w / 2;
          const beamWidth = 26;

          for (let b of retro.bricks) {
            if (b.alive && beamX + beamWidth / 2 > b.x && beamX - beamWidth / 2 < b.x + b.w) {
              b.hp -= 0.08;
              if (b.hp <= 0) {
                b.alive = false;
                addScore(25);
                spawnSparks(b.x + b.w / 2, b.y + b.h / 2, b.color, 16);
                addPopup(b.x + b.w / 2, b.y, '+25', '#ff007f');
              }
            }
          }
        }
      }

      for (let i = retro.balls.length - 1; i >= 0; i--) {
        const b = retro.balls[i];
        if (b.stuck) continue;

        if (!b.trail) b.trail = [];
        b.trail.push({ x: b.x, y: b.y, combo: retro.combo });
        if (b.trail.length > 7) b.trail.shift();

        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.r <= 0) { b.x = b.r + 1; b.vx = Math.abs(b.vx); sndHit(300); }
        else if (b.x + b.r >= W) { b.x = W - b.r - 1; b.vx = -Math.abs(b.vx); sndHit(300); }
        if (b.y - b.r <= 0) { b.y = b.r + 1; b.vy = Math.abs(b.vy); sndHit(300); }

        if (b.y + b.r >= retro.paddle.y && b.y - b.r <= retro.paddle.y + retro.paddle.h && b.x >= retro.paddle.x && b.x <= retro.paddle.x + retro.paddle.w && b.vy > 0) {
          sndPaddle();
          retro.combo = 0;
          const hit = (b.x - (retro.paddle.x + retro.paddle.w / 2)) / (retro.paddle.w / 2);
          const currentSpd = Math.max(7.0, Math.min(10.8, Math.hypot(b.vx, b.vy)));
          b.vx = hit * 6.5;
          const remSq = Math.max(16, currentSpd * currentSpd - b.vx * b.vx);
          b.vy = -Math.sqrt(remSq);
          b.y = retro.paddle.y - b.r;
        }

        for (let brk of retro.bricks) {
          if (!brk.alive) continue;
          if (b.x + b.r > brk.x && b.x - b.r < brk.x + brk.w && b.y + b.r > brk.y && b.y - b.r < brk.y + brk.h) {
            brk.hp--;
            retro.combo++;
            b.vx *= 1.02;
            b.vy *= 1.02;

            if (brk.hp <= 0) {
              brk.alive = false;
              addScore(15 * Math.min(4, retro.combo));
              spawnSparks(brk.x + brk.w / 2, brk.y + brk.h / 2, brk.color, 12);
              addPopup(brk.x + brk.w / 2, brk.y, `+${15 * Math.min(4, retro.combo)}`, brk.color);

              if (Math.random() < 0.24) {
                const types = ['BEAM', 'WIDE', 'MULTI'];
                retro.powerUps.push({
                  x: brk.x + brk.w / 2, y: brk.y + brk.h / 2,
                  type: types[Math.floor(Math.random() * types.length)],
                  vy: 2.4
                });
              }
            }
            sndHit(500 + Math.min(300, retro.combo * 20));
            b.vy *= -1;
            break;
          }
        }

        if (b.y - b.r > H) retro.balls.splice(i, 1);
      }

      if (retro.balls.length === 0) {
        retro.lives--;
        sndDie();
        triggerShake(10, 16);
        if (retro.lives <= 0) {
          showGameOver('CLASSIC CAMPAIGN');
          return;
        } else {
          resetRetroBall();
        }
      }

      for (let i = retro.powerUps.length - 1; i >= 0; i--) {
        const p = retro.powerUps[i];
        p.y += p.vy;
        if (p.y >= retro.paddle.y && p.y <= retro.paddle.y + retro.paddle.h && p.x >= retro.paddle.x && p.x <= retro.paddle.x + retro.paddle.w) {
          sndPower();
          if (p.type === 'BEAM') {
            retro.paddle.hasMegaLaser = true;
            retro.paddle.laserTime = 8.0;
            addPopup(p.x, p.y - 12, 'MEGA PLASMA BEAM (8s)', '#00f0ff');
          } else if (p.type === 'WIDE') {
            retro.paddle.w = 130;
            setTimeout(() => { retro.paddle.w = 88; }, 10000);
            addPopup(p.x, p.y - 12, 'WIDE PADDLE (10s)', '#ffe600');
          } else if (p.type === 'MULTI' && retro.balls[0]) {
            retro.balls.push({ x: retro.balls[0].x, y: retro.balls[0].y, vx: -3.5, vy: -5, r: 8.0, stuck: false, trail: [] });
            retro.balls.push({ x: retro.balls[0].x, y: retro.balls[0].y, vx: 3.5, vy: -5, r: 8.0, stuck: false, trail: [] });
            addPopup(p.x, p.y - 12, 'TRIPLE MULTIBALL', '#39ff14');
          }
          retro.powerUps.splice(i, 1);
        } else if (p.y > H) retro.powerUps.splice(i, 1);
      }

      if (retro.bricks.length > 0 && retro.bricks.every(b => !b.alive)) {
        advanceRetroLevel();
      }
    }

    /* ==============================================================
       8. SWARM ARENA UPDATE (WITH CHUNKY BALLS & ANGLED DEFLECTIONS)
       ============================================================== */
    function updateSwarmEngine() {
      if (swarm.launching && swarm.launchedCount < swarm.ballCount) {
        swarm.launchTimer++;
        if (swarm.launchTimer % 3 === 0) {
          const spd = 9.0;
          swarm.balls.push({
            x: swarm.shooter.x, y: swarm.shooter.y,
            vx: Math.cos(swarm.aimAngle) * spd,
            vy: Math.sin(swarm.aimAngle) * spd,
            r: 5.8,
            trail: []
          });
          swarm.launchedCount++;
        }
      }

      for (let i = swarm.balls.length - 1; i >= 0; i--) {
        const b = swarm.balls[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.r <= 0) { b.x = b.r + 1; b.vx = Math.abs(b.vx); }
        else if (b.x + b.r >= W) { b.x = W - b.r - 1; b.vx = -Math.abs(b.vx); }
        if (b.y - b.r <= 0) { b.y = b.r + 1; b.vy = Math.abs(b.vy); }

        for (let brk of swarm.bricks) {
          if (!brk.alive) continue;
          const bx = SWARM_PAD + brk.c * (SWARM_BW + SWARM_PAD);
          const by = 45 + brk.row * (SWARM_BH + SWARM_PAD);

          if (b.x + b.r > bx && b.x - b.r < bx + SWARM_BW && b.y + b.r > by && b.y - b.r < by + SWARM_BH) {
            brk.hp--;
            addScore(1);
            sndHit(450 + Math.min(320, brk.hp * 6));

            if (brk.isTriangle) {
              const temp = b.vx;
              b.vx = brk.triDir === 'TL' ? -Math.abs(b.vy) : Math.abs(b.vy);
              b.vy = -Math.abs(temp);
            } else {
              b.vy *= -1;
            }

            if (brk.isTNT && brk.hp <= 0) {
              sndBomb();
              triggerShake(12, 18);
              spawnSparks(bx + SWARM_BW / 2, by + SWARM_BH / 2, '#ff5500', 35);
              addPopup(bx + SWARM_BW / 2, by, 'MEGA BOOM!', '#ffaa00');

              for (let other of swarm.bricks) {
                if (other.alive && Math.abs(other.c - brk.c) <= 1 && Math.abs(other.row - brk.row) <= 1) {
                  other.hp -= 25;
                  addScore(5);
                  if (other.hp <= 0) other.alive = false;
                }
              }
            }

            if (brk.hp <= 0) {
              brk.alive = false;
              spawnSparks(bx + SWARM_BW / 2, by + SWARM_BH / 2, '#00f0ff', 8);
            }
            break;
          }
        }

        if (b.y + b.r >= H - 42) {
          if (swarm.newShooterX === null) swarm.newShooterX = b.x;
          swarm.balls.splice(i, 1);
          swarm.ballsReturned++;
        }
      }

      if (swarm.launching && swarm.ballsReturned >= swarm.ballCount) {
        swarm.launching = false;
        btnSwarmRecall.style.display = 'none'; // Hide recall once all balls return!
        swarm.shooter.x = Math.max(25, Math.min(W - 25, swarm.newShooterX || W / 2));
        swarm.level++;
        addSwarmWave();

        for (let b of swarm.bricks) {
          if (b.alive && b.row >= 25) {
            triggerShake(14, 22);
            showGameOver('SWARM ARENA');
            return;
          }
        }
      }
    }

    function spawnSparks(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          r: Math.random() * 2.5 + 1,
          color: color, life: 1
        });
      }
    }

    /* ==============================================================
       9. MASTER RENDER ENGINE (WITH MULTI-BOUNCE AIM REFLECTION)
       ============================================================== */
    function draw() {
      requestAnimationFrame(draw);
      if (isAdPlaying || isGamePaused) return;

      try {
        ctx.save();

        if (shakeTimer > 0) {
          const sx = (Math.random() - 0.5) * shakeMag;
          const sy = (Math.random() - 0.5) * shakeMag;
          ctx.translate(sx, sy);
          shakeTimer--;
        }

        ctx.clearRect(0, 0, W, H);

        // Animated Horizon Grid
        gridOffset = (gridOffset + 1.2) % 30;
        ctx.strokeStyle = '#00f0ff18';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 40) {
          ctx.moveTo(x, H - 120);
          ctx.lineTo((x - W / 2) * 2.2 + W / 2, H);
        }
        for (let y = H - 120; y <= H; y += 18) {
          const py = y + (gridOffset * 0.6);
          if (py <= H) {
            ctx.moveTo(0, py);
            ctx.lineTo(W, py);
          }
        }
        ctx.stroke();

        // RETRO CAMPAIGN
        if (gameState === 'PLAYING_RETRO') {
          for (let b of retro.bricks) {
            if (!b.alive) continue;
            ctx.fillStyle = b.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 3);
            ctx.shadowBlur = 0;

            if (b.hp > 1) {
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 9px monospace';
              ctx.textAlign = 'center';
              ctx.fillText('◆', b.x + b.w / 2, b.y + b.h - 4);
            }
          }

          if (retro.paddle.hasMegaLaser) {
            const beamX = retro.paddle.x + retro.paddle.w / 2;
            ctx.save();
            ctx.shadowBlur = 24;
            ctx.shadowColor = '#00f0ff';
            ctx.fillStyle = 'rgba(0, 240, 255, 0.45)';
            ctx.fillRect(beamX - 16, 0, 32, retro.paddle.y);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(beamX - 5, 0, 10, retro.paddle.y);
            ctx.restore();
          }

          ctx.fillStyle = retro.paddle.hasMegaLaser ? '#ff007f' : '#00f0ff';
          ctx.shadowBlur = 16;
          ctx.shadowColor = ctx.fillStyle;
          ctx.fillRect(retro.paddle.x, retro.paddle.y, retro.paddle.w, retro.paddle.h);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(retro.paddle.x + 4, retro.paddle.y + 2, retro.paddle.w - 8, 3);
          ctx.shadowBlur = 0;

          for (let p of retro.powerUps) {
            ctx.fillStyle = p.type === 'BEAM' ? '#00f0ff' : (p.type === 'MULTI' ? '#39ff14' : '#ffe600');
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#060810';
            ctx.font = 'bold 9px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.type[0], p.x, p.y);
          }

          // Chunky Retro Ball
          for (let b of retro.balls) {
            if (b.trail) {
              for (let t = 0; t < b.trail.length; t++) {
                const alpha = (t + 1) / b.trail.length * 0.55;
                const trailColor = retro.combo > 5 ? `rgba(255, 230, 0, ${alpha})` : `rgba(0, 240, 255, ${alpha})`;
                ctx.fillStyle = trailColor;
                ctx.beginPath();
                ctx.arc(b.trail[t].x, b.trail[t].y, b.r * 0.8, 0, Math.PI * 2);
                ctx.fill();
              }
            }
            const ballColor = retro.combo > 8 ? '#ffe600' : (retro.combo > 4 ? '#ff007f' : '#00f0ff');
            ctx.fillStyle = ballColor;
            ctx.shadowBlur = 16;
            ctx.shadowColor = ballColor;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          if (retro.balls[0] && retro.balls[0].stuck) {
            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`STAGE ${retro.level} - TAP OR SPACE TO LAUNCH`, W / 2, H - 75);
          }

          updateRetroEngine();

        } else if (gameState === 'PLAYING_SWARM') {
          // Render Swarm Bricks
          for (let b of swarm.bricks) {
            if (!b.alive) continue;
            const bx = SWARM_PAD + b.c * (SWARM_BW + SWARM_PAD);
            const by = 45 + b.row * (SWARM_BH + SWARM_PAD);

            if (b.isTriangle) {
              ctx.fillStyle = '#1e1138';
              ctx.strokeStyle = '#b026ff';
              ctx.lineWidth = 1.6;
              ctx.beginPath();
              if (b.triDir === 'TL') {
                ctx.moveTo(bx, by);
                ctx.lineTo(bx + SWARM_BW, by);
                ctx.lineTo(bx, by + SWARM_BH);
              } else {
                ctx.moveTo(bx, by);
                ctx.lineTo(bx + SWARM_BW, by);
                ctx.lineTo(bx + SWARM_BW, by + SWARM_BH);
              }
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = '#ff007f';
              ctx.font = 'bold 9px monospace';
              ctx.textAlign = 'center';
              ctx.fillText(b.hp, bx + SWARM_BW / 2, by + SWARM_BH / 2);

            } else {
              ctx.fillStyle = b.isTNT ? '#ff4400' : (b.hp > 25 ? '#280d38' : '#0a1d37');
              ctx.strokeStyle = b.isTNT ? '#ffaa00' : (b.hp > 25 ? '#b026ff' : '#00f0ff');
              ctx.lineWidth = 1.5;
              ctx.fillRect(bx, by, SWARM_BW, SWARM_BH);
              ctx.strokeRect(bx, by, SWARM_BW, SWARM_BH);

              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 9px monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(b.isTNT ? '💣' : b.hp, bx + SWARM_BW / 2, by + SWARM_BH / 2);
            }
          }

          // RESTORED MULTI-BOUNCE REFLECTION AIM TRAJECTORY
          if (swarm.aiming && !swarm.launching) {
            let curX = swarm.shooter.x;
            let curY = swarm.shooter.y;
            let dirX = Math.cos(swarm.aimAngle);
            let dirY = Math.sin(swarm.aimAngle);
            const ballR = 5.8;
            let remainingDist = 580;

            ctx.strokeStyle = '#00f0ff';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#00f0ff';
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(curX, curY);

            // Calculate wall reflections
            for (let bounce = 0; bounce < 2; bounce++) {
              let hitT = remainingDist;
              let hitWall = 'NONE';

              if (dirX < 0) {
                const t = (ballR - curX) / dirX;
                if (t > 0 && t < hitT) { hitT = t; hitWall = 'X'; }
              } else if (dirX > 0) {
                const t = (W - ballR - curX) / dirX;
                if (t > 0 && t < hitT) { hitT = t; hitWall = 'X'; }
              }

              if (dirY < 0) {
                const t = (ballR - curY) / dirY;
                if (t > 0 && t < hitT) { hitT = t; hitWall = 'Y'; }
              }

              const nextX = curX + dirX * hitT;
              const nextY = curY + dirY * hitT;
              ctx.lineTo(nextX, nextY);

              if (hitWall === 'X') {
                curX = nextX;
                curY = nextY;
                dirX = -dirX; // Bounce off wall!
                remainingDist -= hitT;
              } else {
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(nextX, nextY, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#00f0ff';
                ctx.fill();
                break;
              }
            }

            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
          }

          // Swarm Launcher
          ctx.fillStyle = '#00f0ff';
          ctx.beginPath();
          ctx.arc(swarm.shooter.x, swarm.shooter.y, 8.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#00f0ff';
          ctx.font = 'bold 11px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`x${swarm.ballCount}`, swarm.shooter.x, swarm.shooter.y + 18);

          // Chunky Glowing Swarm Balls
          for (let b of swarm.balls) {
            ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00f0ff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          updateSwarmEngine();
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.life -= 0.035;
          if (pt.life <= 0) { particles.splice(i, 1); continue; }
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.life);
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Popups
        for (let i = popups.length - 1; i >= 0; i--) {
          const pop = popups[i];
          pop.y += pop.vy;
          pop.life -= 0.025;
          if (pop.life <= 0) { popups.splice(i, 1); continue; }
          ctx.fillStyle = pop.color;
          ctx.globalAlpha = Math.max(0, pop.life);
          ctx.font = 'bold 12px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(pop.text, pop.x, pop.y);
        }
        ctx.globalAlpha = 1;

        ctx.restore();

      } catch (err) {
        console.error("[StoneBuilt Engine Guard]:", err);
      }
    }

    /* ==============================================================
       10. BUTTON HOOKS & REWARDED AD LOGIC
       ============================================================== */
    document.getElementById('btn-retro').addEventListener('click', () => {
      initAudioEngine();
      startRetro();
    });

    document.getElementById('btn-swarm').addEventListener('click', () => {
      initAudioEngine();
      startSwarm();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      initAudioEngine();
      startRetro();
    });

    btnRevive.addEventListener('click', () => {
      triggerCrazyGamesRewarded(() => {
        reviveUsedThisSession = true;
        btnRevive.style.display = 'none';
        gameoverScreen.style.display = 'none';

        if (hudLevel.textContent === 'SWARM') {
          gameState = 'PLAYING_SWARM';
          swarmActionBar.style.display = 'flex';
          swarm.bricks = swarm.bricks.filter(b => b.row < 20);
          swarm.balls = [];
          swarm.ballCount += 5;
          addPopup(W / 2, H / 2, 'SURGE CLEARED (+5 BALLS)!', '#00f0ff');
        } else {
          gameState = 'PLAYING_RETRO';
          retro.lives = 1;
          resetRetroBall();
          addPopup(W / 2, H / 2, 'REVIVED (+1 LIFE)!', '#39ff14');
        }
        triggerCrazyGamesStart();
      });
    });

    document.getElementById('btn-to-menu').addEventListener('click', () => {
      gameoverScreen.style.display = 'none';
      overlay.style.display = 'flex';
      gameState = 'MENU';
      swarmActionBar.style.display = 'none';
      triggerCrazyGamesStop();
    });

    hudMenuBtn.addEventListener('click', () => {
      gameState = 'MENU';
      gameoverScreen.style.display = 'none';
      pauseScreen.style.display = 'none';
      swarmActionBar.style.display = 'none';
      overlay.style.display = 'flex';
      triggerCrazyGamesStop();
    });

    draw();
  </script>
