<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StoneBuilt Arcade - Neon Brick Breaker Suite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #060810;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #11152a 0%, #060810 100%);
      border: 2px solid #00f0ff33;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.2);
    }
    #ui-bar {
      width: 100%;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6, 8, 16, 0.95);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 10;
    }
    .hud-val {
      color: #00f0ff;
      font-family: monospace;
      font-size: 15px;
    }
    .hud-btn {
      background: #1a233a;
      border: 1px solid #00f0ff55;
      color: #00f0ff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.15s;
    }
    .hud-btn:active {
      background: #00f0ff;
      color: #060810;
    }
    canvas {
      width: 100%;
      flex-grow: 1;
      display: block;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 8, 16, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 50;
      pointer-events: auto;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 16px #00f0ff;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .brand-sub {
      font-size: 10px;
      color: #ff007f;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 24px;
      font-weight: bold;
    }
    .mode-select-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 15px;
    }
    .btn-action {
      background: linear-gradient(135deg, #161e36, #0e1324);
      border: 2px solid #00f0ff88;
      color: #fff;
      padding: 16px 18px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.1s, border-color 0.2s, background 0.2s;
      width: 100%;
    }
    .btn-action:hover {
      border-color: #00f0ff;
      background: linear-gradient(135deg, #1e294b, #121930);
    }
    .btn-action:active {
      transform: scale(0.97);
    }
    .btn-retro {
      border-color: #ff007f88;
    }
    .btn-retro:hover {
      border-color: #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
    }
    .btn-swarm {
      border-color: #00f0ff88;
    }
    .btn-swarm:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .mode-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .mode-desc {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.4;
    }
    .gameover-score {
      font-size: 34px;
      font-weight: bold;
      color: #ffe600;
      font-family: monospace;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div>SCORE: <span id="score-display" class="hud-val">0</span></div>
      <div id="mid-stat">MODE: <span id="mode-display" class="hud-val">ARCADE</span></div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="speed-btn" class="hud-btn" style="display:none;">1X</button>
        <button id="menu-btn" class="hud-btn">MENU</button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Overlay Menu -->
    <div id="overlay">
      <div class="brand-sub">StoneBuilt Entertainment Presents</div>
      <h1 id="overlay-title">Neon Breaker</h1>
      <p id="overlay-msg" style="color: #94a3b8; margin-bottom: 20px; font-size: 13px;">Choose Your Arcade Experience</p>

      <!-- Main Menu Buttons -->
      <div id="menu-view" class="mode-select-box">
        <button class="btn-action btn-retro" id="btn-retro">
          <div class="mode-title" style="color: #ff007f;">🕹️ CLASSIC RETRO</div>
          <div class="mode-desc">Paddle controls, falling power-ups (lasers & multiball), 80s arcade physics.</div>
        </button>

        <button class="btn-action btn-swarm" id="btn-swarm">
          <div class="mode-title" style="color: #00f0ff;">⚡ MODERN SWARM</div>
          <div class="mode-desc">Drag to aim, launch streams of 30+ balls, blast high-HP bricks & TNT blocks.</div>
        </button>
      </div>

      <!-- Game Over View -->
      <div id="gameover-view" style="display:none; width: 100%; max-width: 320px;">
        <div class="gameover-score" id="final-score-display">0</div>
        <button id="btn-restart" class="btn-action btn-swarm" style="text-align:center; font-weight:bold; margin-bottom:10px;">
          PLAY AGAIN
        </button>
        <button id="btn-to-menu" class="btn-action" style="text-align:center;">
          BACK TO MENU
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTone(freq, type = 'sine', duration = 0.08, vol = 0.1) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const sndHit = (f = 450) => playTone(f, 'triangle', 0.06, 0.12);
    const sndPaddle = () => playTone(380, 'sine', 0.08, 0.15);
    const sndLaser = () => playTone(880, 'sawtooth', 0.09, 0.08);
    const sndPower = () => playTone(740, 'square', 0.16, 0.1);
    const sndBomb = () => playTone(110, 'sawtooth', 0.35, 0.22);
    const sndDie = () => playTone(140, 'sawtooth', 0.4, 0.15);

    // --- DOM REFERENCES ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const menuView = document.getElementById('menu-view');
    const gameoverView = document.getElementById('gameover-view');
    const finalScoreDisplay = document.getElementById('final-score-display');
    const scoreDisplay = document.getElementById('score-display');
    const modeDisplay = document.getElementById('mode-display');
    const midStat = document.getElementById('mid-stat');
    const speedBtn = document.getElementById('speed-btn');
    const menuBtn = document.getElementById('menu-btn');

    let W = 0, H = 0;
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      W = canvas.width;
      H = canvas.height;
    }

    // --- MASTER ENGINE STATE ---
    let gameState = 'MENU'; // 'MENU', 'PLAYING_RETRO', 'PLAYING_SWARM'
    let score = 0;
    let particles = [];

    // =====================================
    // 1. CLASSIC RETRO ENGINE
    // =====================================
    const retro = {
      lives: 3,
      level: 1,
      paddle: { w: 85, h: 12, x: 0, y: 0, hasLasers: false },
      balls: [],
      bricks: [],
      powerUps: [],
      lasers: []
    };

    function startRetroGame() {
      gameState = 'PLAYING_RETRO';
      modeDisplay.textContent = 'RETRO';
      speedBtn.style.display = 'none';
      score = 0;
      retro.lives = 3;
      retro.level = 1;
      scoreDisplay.textContent = score;
      midStat.innerHTML = `LIVES: <span style="color:#ff007f;">❤️❤️❤️</span>`;
      resizeCanvas();
      initRetroBricks();
      resetRetroBall();
    }

    function initRetroBricks() {
      retro.bricks = [];
      const cols = 7, rows = 6;
      const padding = 6;
      const bW = (W - (padding * (cols + 1))) / cols;
      const bH = 16;
      const colors = ['#ff007f', '#ff5500', '#ffe600', '#39ff14', '#00f0ff', '#b026ff'];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          retro.bricks.push({
            x: padding + c * (bW + padding),
            y: 40 + r * (bH + padding),
            w: bW,
            h: bH,
            color: colors[r % colors.length],
            hp: (retro.level >= 2 && r === 0) ? 2 : 1,
            alive: true
          });
        }
      }
    }

    function resetRetroBall() {
      retro.paddle.w = 85;
      retro.paddle.hasLasers = false;
      retro.balls = [{
        x: W / 2,
        y: H - 45,
        vx: 3.5 * (Math.random() > 0.5 ? 1 : -1),
        vy: -5,
        r: 6,
        stuck: true
      }];
    }

    // =====================================
    // 2. MODERN SWARM ENGINE
    // =====================================
    const swarm = {
      level: 1,
      ballCount: 15,
      balls: [],
      bricks: [],
      pickups: [],
      shooter: { x: 0, y: 0 },
      aiming: false,
      aimAngle: -Math.PI / 2,
      launching: false,
      launchTimer: 0,
      launchedCount: 0,
      ballsReturned: 0,
      newShooterX: null,
      speedMultiplier: 1
    };

    function startSwarmGame() {
      gameState = 'PLAYING_SWARM';
      modeDisplay.textContent = 'SWARM';
      speedBtn.style.display = 'block';
      speedBtn.textContent = '1X';
      swarm.speedMultiplier = 1;
      score = 0;
      swarm.level = 1;
      swarm.ballCount = 15;
      swarm.balls = [];
      resizeCanvas();
      swarm.shooter.x = W / 2;
      swarm.shooter.y = H - 25;
      scoreDisplay.textContent = score;
      midStat.innerHTML = `BALLS: <span class="hud-val">${swarm.ballCount}</span>`;
      swarm.bricks = [];
      swarm.pickups = [];
      addSwarmWave();
      addSwarmWave();
      addSwarmWave();
    }

    function addSwarmWave() {
      const cols = 7;
      const padding = 6;
      const bW = (W - (padding * (cols + 1))) / cols;
      const bH = 26;

      for (let b of swarm.bricks) b.row++;
      for (let p of swarm.pickups) p.row++;

      for (let c = 0; c < cols; c++) {
        const rand = Math.random();
        if (rand < 0.45) {
          const hp = Math.max(1, Math.round(swarm.level * (1 + Math.random() * 1.4)));
          const isTNT = Math.random() < 0.12;
          swarm.bricks.push({
            c: c,
            row: 1,
            w: bW,
            h: bH,
            hp: hp,
            isTNT: isTNT,
            alive: true
          });
        } else if (rand < 0.62) {
          swarm.pickups.push({
            c: c,
            row: 1,
            w: bW,
            h: bH,
            collected: false
          });
        }
      }
    }

    // =====================================
    // PARTICLES
    // =====================================
    function spawnSparks(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          r: Math.random() * 2.5 + 1,
          color: color,
          life: 1
        });
      }
    }

    // =====================================
    // TOUCH & POINTER INPUTS
    // =====================================
    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onPointerMove(clientX, clientY) {
      if (gameState === 'MENU') return;
      const pt = getCanvasPos(clientX, clientY);

      if (gameState === 'PLAYING_RETRO') {
        retro.paddle.x = Math.max(0, Math.min(W - retro.paddle.w, pt.x - retro.paddle.w / 2));
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].x = retro.paddle.x + retro.paddle.w / 2;
        }
      } else if (gameState === 'PLAYING_SWARM' && !swarm.launching) {
        if (pt.y < swarm.shooter.y - 15) {
          swarm.aiming = true;
          swarm.aimAngle = Math.atan2(pt.y - swarm.shooter.y, pt.x - swarm.shooter.x);
        }
      }
    }

    function onPointerUp() {
      if (gameState === 'MENU') return;

      if (gameState === 'PLAYING_RETRO') {
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].stuck = false;
          sndPaddle();
        }
        if (retro.paddle.hasLasers) {
          sndLaser();
          retro.lasers.push({ x: retro.paddle.x + 8, y: retro.paddle.y - 4, vy: -9 });
          retro.lasers.push({ x: retro.paddle.x + retro.paddle.w - 8, y: retro.paddle.y - 4, vy: -9 });
        }
      } else if (gameState === 'PLAYING_SWARM') {
        if (swarm.aiming && !swarm.launching) {
          swarm.aiming = false;
          swarm.launching = true;
          swarm.launchedCount = 0;
          swarm.ballsReturned = 0;
          swarm.launchTimer = 0;
          swarm.balls = [];
          swarm.newShooterX = null;
        }
      }
    }

    canvas.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    });

    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchend', onPointerUp);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') onPointerUp();
      if (gameState === 'PLAYING_RETRO') {
        if (e.code === 'ArrowLeft') retro.paddle.x = Math.max(0, retro.paddle.x - 30);
        if (e.code === 'ArrowRight') retro.paddle.x = Math.min(W - retro.paddle.w, retro.paddle.x + 30);
      }
    });

    // Speed button for Swarm
    speedBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (swarm.speedMultiplier === 1) {
        swarm.speedMultiplier = 2;
        speedBtn.textContent = '2X';
      } else if (swarm.speedMultiplier === 2) {
        swarm.speedMultiplier = 3;
        speedBtn.textContent = '3X';
      } else {
        swarm.speedMultiplier = 1;
        speedBtn.textContent = '1X';
      }
    });

    function triggerGameOver(modeName) {
      gameState = 'MENU';
      overlay.style.display = 'flex';
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ff007f';
      overlayMsg.textContent = `${modeName} FINAL SCORE`;
      menuView.style.display = 'none';
      gameoverView.style.display = 'block';
      finalScoreDisplay.textContent = score;
    }

    // =====================================
    // UPDATE ENGINES
    // =====================================
    function updateRetro() {
      retro.paddle.y = H - 28;

      // Lasers
      for (let i = retro.lasers.length - 1; i >= 0; i--) {
        const l = retro.lasers[i];
        l.y += l.vy;
        if (l.y < 0) { retro.lasers.splice(i, 1); continue; }
        for (let b of retro.bricks) {
          if (b.alive && l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
            b.hp--;
            if (b.hp <= 0) {
              b.alive = false;
              score += 20;
              spawnSparks(b.x + b.w / 2, b.y + b.h / 2, b.color);
            }
            sndHit(750);
            retro.lasers.splice(i, 1);
            break;
          }
        }
      }

      // Balls
      for (let i = retro.balls.length - 1; i >= 0; i--) {
        const b = retro.balls[i];
        if (b.stuck) continue;
        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.r < 0 || b.x + b.r > W) { b.vx *= -1; sndHit(300); }
        if (b.y - b.r < 0) { b.vy *= -1; sndHit(300); }

        // Paddle
        if (b.y + b.r >= retro.paddle.y && b.y - b.r <= retro.paddle.y + retro.paddle.h && b.x >= retro.paddle.x && b.x <= retro.paddle.x + retro.paddle.w && b.vy > 0) {
          sndPaddle();
          const hit = (b.x - (retro.paddle.x + retro.paddle.w / 2)) / (retro.paddle.w / 2);
          const spd = Math.hypot(b.vx, b.vy);
          b.vx = hit * 6;
          b.vy = -Math.abs(Math.sqrt(Math.max(16, spd * spd - b.vx * b.vx)));
          b.y = retro.paddle.y - b.r;
        }

        // Bricks
        for (let brk of retro.bricks) {
          if (!brk.alive) continue;
          if (b.x + b.r > brk.x && b.x - b.r < brk.x + brk.w && b.y + b.r > brk.y && b.y - b.r < brk.y + brk.h) {
            brk.hp--;
            if (brk.hp <= 0) {
              brk.alive = false;
              score += 15;
              spawnSparks(brk.x + brk.w / 2, brk.y + brk.h / 2, brk.color);
              if (Math.random() < 0.22) {
                const types = ['MULTI', 'LASER', 'WIDE'];
                retro.powerUps.push({
                  x: brk.x + brk.w / 2,
                  y: brk.y + brk.h / 2,
                  type: types[Math.floor(Math.random() * types.length)],
                  vy: 2.2
                });
              }
            }
            sndHit(520);
            b.vy *= -1;
            break;
          }
        }

        if (b.y - b.r > H) retro.balls.splice(i, 1);
      }

      // Ball Loss
      if (retro.balls.length === 0) {
        retro.lives--;
        sndDie();
