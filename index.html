<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>StoneBuilt Arcade - Neon Breakout</title>
  
  <!-- CrazyGames SDK v3 Universal -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #05050d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #arcade-container {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      max-height: 820px;
      background: radial-gradient(circle at 50% 30%, #0d1226 0%, #04060e 100%);
      border: 2px solid #00f0ff33;
      box-shadow: 0 0 30px #00f0ff22, inset 0 0 40px #ff007f11;
      display: flex;
      flex-direction: column;
    }

    /* Top HUD Bar */
    #top-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(5, 7, 18, 0.85);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 10;
    }

    .hud-val {
      color: #00f0ff;
    }
    .hud-val-gold {
      color: #ffd700;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #fff;
      padding: 4px 9px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.15s;
    }
    .hud-btn:hover {
      background: rgba(0, 240, 255, 0.25);
    }

    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: none;
    }

    /* UI Modals / Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 14, 0.90);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    .game-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 15px #00f0ff, 0 0 30px #ff007f;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .game-subtitle {
      font-size: 12px;
      color: #ff007f;
      letter-spacing: 3px;
      margin-bottom: 24px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .score-banner {
      font-size: 44px;
      font-weight: 900;
      color: #ffd700;
      font-family: "Courier New", Courier, monospace;
      text-shadow: 0 0 20px #ffd70088;
      margin-bottom: 4px;
    }

    .best-banner {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .btn-main {
      width: 240px;
      padding: 14px 20px;
      margin: 8px 0;
      border: 1px solid #00f0ff;
      background: linear-gradient(135deg, #00f0ff22, #ff007f33);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      transition: all 0.15s ease;
    }
    .btn-main:hover {
      background: linear-gradient(135deg, #00f0ff55, #ff007f66);
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }

    .btn-secondary {
      width: 240px;
      padding: 11px 16px;
      margin: 6px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="arcade-container">
    <!-- Top HUD -->
    <div id="top-hud">
      <div>SCORE: <span id="hud-score" class="hud-val">0</span></div>
      <div>BEST: <span id="hud-best" class="hud-val-gold">0</span></div>
      <div>BALLS: <span id="hud-balls" class="hud-val">1</span></div>
      <div style="display: flex; gap: 6px;">
        <button id="btn-sound" class="hud-btn">🔊</button>
        <button id="btn-speed" class="hud-btn">1X</button>
        <button id="btn-menu" class="hud-btn">MENU</button>
      </div>
    </div>

    <!-- Canvas Game Board -->
    <canvas id="gameCanvas"></canvas>

    <!-- Main Menu: Select Classic or Modern Swarm -->
    <div id="menu-overlay" class="overlay">
      <div class="game-title">StoneBuilt Arcade</div>
      <div class="game-subtitle">Neon Breakout</div>
      
      <!-- The Two Game Mode Buttons -->
      <button id="btn-mode-classic" class="btn-main" style="border-color: #ffd700; box-shadow: 0 0 15px #ffd70044;">Classic Mode</button>
      <button id="btn-mode-swarm" class="btn-main">Modern Swarm Mode</button>
      
      <div style="margin-top: 15px; font-size: 11px; color: #64748b; letter-spacing: 1px;">
        CONTROLS: TOUCH DRAG OR MOUSE
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="overlay hidden">
      <div style="font-size: 12px; color: #ff007f; letter-spacing: 2px; font-weight: bold; margin-bottom: 4px;">GAME OVER</div>
      <div id="gameover-title" class="game-title" style="font-size: 20px;">Game Over</div>
      <div id="final-score" class="score-banner">0</div>
      <div id="final-best" class="best-banner">ALL-TIME BEST: 0</div>
      <button id="btn-play-again" class="btn-main">Play Again</button>
      <button id="btn-return-menu" class="btn-secondary">Return to Menu</button>
    </div>
  </div>

  <script>
    /* ==============================================================
       1. CRAZYGAMES SDK v3 INTEGRATION (UNIVERSAL & TEST-READY)
       ============================================================== */
    let crazyGamesReady = false;

    async function initCrazyGames() {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        try {
          await window.CrazyGames.SDK.init();
          crazyGamesReady = true;
          console.log("CrazyGames SDK v3 initialized successfully!");
        } catch (e) {
          console.log("CrazyGames test/standalone mode:", e);
        }
      }
    }
    initCrazyGames();

    function triggerCrazyGamesGameplayStart() {
      if (crazyGamesReady && window.CrazyGames?.SDK?.game) {
        try {
          window.CrazyGames.SDK.game.gameplayStart();
        } catch (e) {}
      }
    }

    function triggerCrazyGamesGameplayStop() {
      if (crazyGamesReady && window.CrazyGames?.SDK?.game) {
        try {
          window.CrazyGames.SDK.game.gameplayStop();
        } catch (e) {}
      }
    }

    function triggerCrazyGamesAd() {
      if (crazyGamesReady && window.CrazyGames?.SDK?.ad) {
        try {
          window.CrazyGames.SDK.ad.requestAd("midroll", {
            adStarted: () => console.log("CrazyGames Ad started"),
            adFinished: () => console.log("CrazyGames Ad finished"),
            adError: (err) => console.log("CrazyGames Ad error/skipped:", err)
          });
        } catch (e) {
          console.log("Ad request skipped in test mode:", e);
        }
      }
    }

    /* ==============================================================
       2. RETRO SYNTH AUDIO (ZERO EXTERNAL DOWNLOADS)
       ============================================================== */
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.08, vol = 0.15) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    const soundHitPaddle = () => playTone(340, 'triangle', 0.08, 0.2);
    const soundHitBrick = (pitchMult = 1) => playTone(480 * pitchMult, 'square', 0.06, 0.12);
    const soundPowerup = () => playTone(880, 'sine', 0.25, 0.25);
    const soundGameOver = () => {
      playTone(280, 'sawtooth', 0.2, 0.25);
      setTimeout(() => playTone(180, 'sawtooth', 0.4, 0.25), 180);
    };

    /* ==============================================================
       3. CORE ENGINE & MODES (CLASSIC + MODERN SWARM)
       ============================================================== */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // UI elements
    const hudScore = document.getElementById("hud-score");
    const hudBest = document.getElementById("hud-best");
    const hudBalls = document.getElementById("hud-balls");
    const menuOverlay = document.getElementById("menu-overlay");
    const gameOverOverlay = document.getElementById("gameover-overlay");
    const gameoverTitle = document.getElementById("gameover-title");
    const finalScore = document.getElementById("final-score");
    const finalBest = document.getElementById("final-best");
    const btnSound = document.getElementById("btn-sound");
    const btnSpeed = document.getElementById("btn-speed");
    const btnMenu = document.getElementById("btn-menu");
    const btnModeClassic = document.getElementById("btn-mode-classic");
    const btnModeSwarm = document.getElementById("btn-mode-swarm");
    const btnPlayAgain = document.getElementById("btn-play-again");
    const btnReturnMenu = document.getElementById("btn-return-menu");

    let width = 0;
    let height = 0;
    let score = 0;
    let activeMode = "SWARM"; // "CLASSIC" or "SWARM"
    let bestScore = parseInt(localStorage.getItem("stonebuilt_breakout_best") || "0", 10);
    hudBest.textContent = bestScore;

    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
    let gameSpeedMultiplier = 1.0;

    // Screen Shake & Particles
    let shakeDuration = 0;
    let shakeIntensity = 0;
    let particles = [];

    // Paddle
    const paddle = {
      x: 0,
      y: 0,
      w: 90,
      h: 12,
      targetX: 0
    };

    // Balls array
    let balls = [];
    const BALL_RADIUS = 5;

    // Power-ups
    let powerUps = [];

    // Bricks Grid
    const brickConfig = {
      rows: 6,
      cols: 7,
      padding: 6,
      offsetTop: 60,
      h: 18,
      w: 0
    };
    let bricks = [];

    const NEON_COLORS = [
      { border: "#ff007f", fill: "#ff007f33", glow: "#ff007f", pts: 50 },
      { border: "#00f0ff", fill: "#00f0ff33", glow: "#00f0ff", pts: 40 },
      { border: "#ffd700", fill: "#ffd70033", glow: "#ffd700", pts: 30 },
      { border: "#39ff14", fill: "#39ff1433", glow: "#39ff14", pts: 20 },
      { border: "#bf00ff", fill: "#bf00ff33", glow: "#bf00ff", pts: 10 }
    ];

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width;
      canvas.height = height;

      paddle.y = height - 34;
      if (paddle.x === 0) paddle.x = (width - paddle.w) / 2;
      paddle.targetX = paddle.x;

      brickConfig.w = (width - (brickConfig.padding * (brickConfig.cols + 1))) / brickConfig.cols;
    }
    window.addEventListener("resize", resize);
    window.addEventListener("load", resize);

    function initBricks() {
      bricks = [];
      for (let r = 0; r < brickConfig.rows; r++) {
        const color = NEON_COLORS[r % NEON_COLORS.length];
        for (let c = 0; c < brickConfig.cols; c++) {
          const bx = brickConfig.padding + c * (brickConfig.w + brickConfig.padding);
          const by = brickConfig.offsetTop + r * (brickConfig.h + brickConfig.padding);
          bricks.push({
            x: bx,
            y: by,
            w: brickConfig.w,
            h: brickConfig.h,
            alive: true,
            color: color
          });
        }
      }
    }

    function createBall(x, y, vx, vy) {
      return {
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        r: BALL_RADIUS,
        trail: []
      };
    }

    function triggerScreenShake(duration = 10, intensity = 6) {
      shakeDuration = duration;
      shakeIntensity = intensity;
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 4 + 1.5) * gameSpeedMultiplier;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 25 + Math.random() * 15,
          maxLife: 40,
          color: color,
          size: Math.random() * 2.5 + 1.5
        });
      }
    }

    function spawnPowerUp(x, y) {
      // In Classic Mode, NO swarm power-ups (pure 1-ball classic!). Only expand paddle.
      if (activeMode === "CLASSIC") {
        if (Math.random() < 0.15) {
          powerUps.push({ x: x, y: y, vy: 2.2 * gameSpeedMultiplier, type: "EXPAND", r: 9 });
        }
        return;
      }

      // In Modern Swarm Mode: Multi-ball swarms and paddle expand!
      if (Math.random() < 0.28) {
        const types = ["SWARM", "EXPAND", "SWARM"];
        const chosen = types[Math.floor(Math.random() * types.length)];
        powerUps.push({
          x: x,
          y: y,
          vy: 2.2 * gameSpeedMultiplier,
          type: chosen,
          r: 9
        });
      }
    }

    function startNewGame(mode = "SWARM") {
      activeMode = mode;
      resize();
      score = 0;
      hudScore.textContent = score;
      gameSpeedMultiplier = 1.0;
      btnSpeed.textContent = "1X";
      powerUps = [];
      particles = [];

      paddle.w = activeMode === "CLASSIC" ? 85 : 90;
      paddle.x = (width - paddle.w) / 2;
      paddle.targetX = paddle.x;

      initBricks();

      // Launch initial ball
      balls = [
        createBall(
          width / 2,
          paddle.y - 12,
          (Math.random() > 0.5 ? 3.2 : -3.2),
          -4.5
        )
      ];

      hudBalls.textContent = balls.length;
      gameState = "PLAYING";

      menuOverlay.classList.add("hidden");
      gameOverOverlay.classList.add("hidden");

      // Notify CrazyGames gameplay started (works for both modes!)
      triggerCrazyGamesGameplayStart();
    }

    function triggerGameOver() {
      gameState = "GAMEOVER";
      soundGameOver();
      triggerScreenShake(20, 10);

      // Stop CrazyGames gameplay & trigger ad (works for both modes!)
      triggerCrazyGamesGameplayStop();
      triggerCrazyGamesAd();

      // Save Best Score
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("stonebuilt_breakout_best", bestScore);
        hudBest.textContent = bestScore;
      }

      // Set Title based on which mode you were playing
      if (activeMode === "CLASSIC") {
        gameoverTitle.textContent = "Classic Game Over";
      } else {
        gameoverTitle.textContent = "Modern Swarm Game Over";
      }

      finalScore.textContent = score;
      finalBest.textContent = `ALL-TIME BEST: ${bestScore}`;
      gameOverOverlay.classList.remove("hidden");
    }

    /* ==============================================================
       4. CONTROLS: MOUSE, TOUCH, KEYBOARD
       ============================================================== */
    function setPaddlePosition(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relativeX = clientX - rect.left;
      paddle.targetX = Math.max(0, Math.min(width - paddle.w, relativeX - paddle.w / 2));
    }

    canvas.addEventListener("mousemove", (e) => {
      if (gameState === "PLAYING") setPaddlePosition(e.clientX);
    });

    canvas.addEventListener("touchmove", (e) => {
      if (gameState === "PLAYING" && e.touches.length > 0) {
        setPaddlePosition(e.touches[0].clientX);
      }
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (gameState === "PLAYING") {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
          paddle.targetX = Math.max(0, paddle.targetX - 25);
        } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
          paddle.targetX = Math.min(width - paddle.w, paddle.targetX + 25);
        }
      }
    });

    // Menu Buttons: Classic vs Modern Swarm
    btnModeClassic.addEventListener("click", () => {
      getAudioContext();
      startNewGame("CLASSIC");
    });

    btnModeSwarm.addEventListener("click", () => {
      getAudioContext();
      startNewGame("SWARM");
    });

    btnPlayAgain.addEventListener("click", () => {
      startNewGame(activeMode);
    });

    btnReturnMenu.addEventListener("click", () => {
      gameState = "MENU";
      gameOverOverlay.classList.add("hidden");
      menuOverlay.classList.remove("hidden");
      triggerCrazyGamesGameplayStop();
    });

    btnMenu.addEventListener("click", () => {
      if (gameState === "PLAYING") {
        triggerGameOver();
      }
    });

    btnSound.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      btnSound.textContent = soundEnabled ? "🔊" : "🔇";
    });

    btnSpeed.addEventListener("click", () => {
      if (gameSpeedMultiplier === 1.0) {
        gameSpeedMultiplier = 1.5;
        btnSpeed.textContent = "1.5X";
      } else if (gameSpeedMultiplier === 1.5) {
        gameSpeedMultiplier = 2.0;
        btnSpeed.textContent = "2X";
      } else {
        gameSpeedMultiplier = 1.0;
        btnSpeed.textContent = "1X";
      }
    });

    /* ==============================================================
       5. MAIN PHYSICS & ANIMATION LOOP
       ============================================================== */
    function update() {
      if (gameState !== "PLAYING") return;

      // Smooth paddle lerp
      paddle.x += (paddle.targetX - paddle.x) * 0.35;

      // Handle screen shake decay
      if (shakeDuration > 0) shakeDuration--;

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update power-ups
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.y += pu.vy;

        // Catch with paddle
        if (
          pu.y + pu.r >= paddle.y &&
          pu.y - pu.r <= paddle.y + paddle.h &&
          pu.x >= paddle.x &&
          pu.x <= paddle.x + paddle.w
        ) {
          soundPowerup();

          if (pu.type === "SWARM" && activeMode === "SWARM") {
            // Multiply balls for swarm mode!
            const newBalls = [];
            balls.forEach(b => {
              newBalls.push(createBall(b.x, b.y, b.vx + 1.8, b.vy - 0.5));
              newBalls.push(createBall(b.x, b.y, b.vx - 1.8, b.vy - 0.5));
            });
            balls = balls.concat(newBalls);
            if (balls.length > 35) balls = balls.slice(0, 35);
          } else if (pu.type === "EXPAND") {
            paddle.w = Math.min(140, paddle.w + 30);
          }

          powerUps.splice(i, 1);
          continue;
        }

        if (pu.y > height + 20) powerUps.splice(i, 1);
      }

      // Update balls
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Store trail
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 5) b.trail.shift();

        // Move
        b.x += b.vx * gameSpeedMultiplier;
        b.y += b.vy * gameSpeedMultiplier;

        // Wall collisions
        if (b.x - b.r <= 0) {
          b.x = b.r;
          b.vx = Math.abs(b.vx);
          soundHitPaddle();
        } else if (b.x + b.r >= width) {
          b.x = width - b.r;
          b.vx = -Math.abs(b.vx);
          soundHitPaddle();
        }

        // Top wall
        if (b.y - b.r <= 0) {
          b.y = b.r;
          b.vy = Math.abs(b.vy);
          soundHitPaddle();
        }

        // Paddle collision
        if (
          b.y + b.r >= paddle.y &&
          b.y - b.r <= paddle.y + paddle.h &&
          b.x >= paddle.x &&
          b.x <= paddle.x + paddle.w
        ) {
          b.y = paddle.y - b.r;
          const hitOffset = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
          b.vx = hitOffset * (speed * 0.95);
          b.vy = -Math.sqrt(Math.max(1, speed * speed - b.vx * b.vx));

          soundHitPaddle();
        }

        // Brick collision
        for (let j = 0; j < bricks.length; j++) {
          const br = bricks[j];
          if (!br.alive) continue;

          if (
            b.x + b.r >= br.x &&
            b.x - b.r <= br.x + br.w &&
            b.y + b.r >= br.y &&
            b.y - b.r <= br.y + br.h
          ) {
            br.alive = false;
            b.vy = -b.vy;

            score += br.color.pts;
            hudScore.textContent = score;

            soundHitBrick(1 + (score % 500) / 1000);
            triggerScreenShake(7, 4);
            createExplosion(br.x + br.w / 2, br.y + br.h / 2, br.color.border);
            spawnPowerUp(br.x + br.w / 2, br.y + br.h / 2);

            break;
          }
        }

        // Bottom death
        if (b.y - b.r > height) {
          balls.splice(i, 1);
        }
      }

      hudBalls.textContent = balls.length;

      // Check game over
      if (balls.length === 0) {
        triggerGameOver();
        return;
      }

      // Check wave clear (Respawn bricks)
      const remainingBricks = bricks.filter(b => b.alive).length;
      if (remainingBricks === 0) {
        initBricks();
        triggerScreenShake(15, 7);
      }
    }

    /* ==============================================================
       6. RENDER LOOP (RETRO SYNTHWAVE)
       ============================================================== */
    function render() {
      ctx.save();

      if (shakeDuration > 0) {
        const ox = (Math.random() - 0.5) * shakeIntensity;
        const oy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(ox, oy);
      }

      ctx.clearRect(0, 0, width, height);

      // Faint grid
      ctx.strokeStyle = "rgba(0, 240, 255, 0.04)";
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      // Bricks
      for (let i = 0; i < bricks.length; i++) {
        const br = bricks[i];
        if (!br.alive) continue;

        ctx.shadowColor = br.color.glow;
        ctx.shadowBlur = 10;
        ctx.fillStyle = br.color.fill;
        ctx.strokeStyle = br.color.border;
        ctx.lineWidth = 1.5;

        ctx.fillRect(br.x, br.y, br.w, br.h);
        ctx.strokeRect(br.x, br.y, br.w, br.h);
      }

      // Power-ups
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#ffd700";
      powerUps.forEach(pu => {
        ctx.fillStyle = pu.type === "SWARM" ? "#00f0ff" : "#ffd700";
        ctx.beginPath();
        ctx.arc(pu.x, pu.y, pu.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#05050d";
        ctx.font = "9px bold sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(pu.type[0], pu.x, pu.y + 3);
      });

      // Particles
      ctx.shadowBlur = 6;
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      // Balls
      balls.forEach(b => {
        b.trail.forEach((t, idx) => {
          ctx.beginPath();
          ctx.arc(t.x, t.y, b.r * (idx / b.trail.length), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 215, 0, ${idx * 0.12})`;
          ctx.fill();
        });

        ctx.shadowColor = "#ffd700";
        ctx.shadowBlur = 14;
        ctx.fillStyle = "#fff7cc";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Paddle
      ctx.shadowColor = "#00f0ff";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#00f0ff";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(paddle.x + 4, paddle.y + 3, paddle.w - 8, 3);

      ctx.restore();

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
