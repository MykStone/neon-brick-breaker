<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StoneBuilt Arcade - Neon Breaker Suite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }
    #cabinet {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 780px;
      background: #080b16;
      border: 2px solid #00f0ff44;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
      display: flex;
      flex-direction: column;
    }
    #top-hud {
      height: 50px;
      width: 100%;
      padding: 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b0f1e;
      border-bottom: 2px solid #00f0ff33;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      z-index: 10;
    }
    .hud-accent {
      color: #00f0ff;
      font-family: monospace;
      font-size: 15px;
    }
    .hud-gold {
      color: #ffe600;
      font-family: monospace;
      font-size: 13px;
    }
    .hud-btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .hud-ctrl-btn {
      background: #141b30;
      border: 1px solid #00f0ff66;
      color: #00f0ff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .hud-ctrl-btn:active {
      background: #00f0ff;
      color: #080b16;
    }
    #canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #overlay, #gameover-screen {
      position: absolute;
      inset: 0;
      background: rgba(6, 8, 16, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    .brand-eyebrow {
      font-size: 11px;
      font-weight: 800;
      color: #ff007f;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .main-title {
      font-size: 30px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 18px #00f0ff;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .menu-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    .menu-button-stack {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .menu-card-btn {
      background: #0e1424;
      border: 2px solid;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      display: block;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .menu-card-btn:active {
      transform: scale(0.97);
    }
    .card-retro {
      border-color: #ff007f;
    }
    .card-retro:hover {
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
    }
    .card-swarm {
      border-color: #00f0ff;
    }
    .card-swarm:hover {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .btn-header {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .btn-body {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .gameover-val {
      font-size: 40px;
      font-weight: 900;
      color: #ffe600;
      font-family: monospace;
      margin-bottom: 8px;
    }
    .hi-score-tag {
      font-size: 13px;
      color: #00f0ff;
      font-family: monospace;
      margin-bottom: 20px;
    }
    .action-btn {
      background: #00f0ff;
      color: #060810;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 240px;
      margin-bottom: 12px;
    }
    .sub-action-btn {
      background: transparent;
      border: 1px solid #64748b;
      color: #94a3b8;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      max-width: 240px;
    }
  </style>
</head>
<body>

  <div id="cabinet">
    <!-- Top HUD -->
    <div id="top-hud">
      <div>SCORE: <span id="hud-score" class="hud-accent">0</span></div>
      <div>BEST: <span id="hud-best" class="hud-gold">0</span></div>
      <div id="hud-center">MODE: <span id="hud-mode" class="hud-accent">ARCADE</span></div>
      <div class="hud-btn-group">
        <button id="hud-mute-btn" class="hud-ctrl-btn" title="Toggle Sound">🔊</button>
        <button id="hud-speed-btn" class="hud-ctrl-btn" style="display:none;">1X</button>
        <button id="hud-menu-btn" class="hud-ctrl-btn">MENU</button>
      </div>
    </div>

    <!-- Playfield Canvas Area -->
    <div id="canvas-wrap">
      <canvas id="gameCanvas" width="460" height="700"></canvas>

      <!-- Main Menu Screen -->
      <div id="overlay">
        <div class="brand-eyebrow">StoneBuilt Entertainment</div>
        <div class="main-title">Neon Breaker</div>
        <div class="menu-sub">Choose Your Arcade Engine</div>

        <div class="menu-button-stack">
          <button id="btn-retro" class="menu-card-btn card-retro">
            <div class="btn-header" style="color:#ff007f;">🕹️ CLASSIC RETRO</div>
            <div class="btn-body">Paddle controls, falling lasers/multiball, and authentic 80s brick physics.</div>
          </button>

          <button id="btn-swarm" class="menu-card-btn card-swarm">
            <div class="btn-header" style="color:#00f0ff;">⚡ MODERN SWARM</div>
            <div class="btn-body">Bank-shot aiming laser, dense micro-bricks, and explosive TNT chain reactions.</div>
          </button>
        </div>
      </div>

      <!-- Game Over Screen -->
      <div id="gameover-screen" style="display:none;">
        <div class="brand-eyebrow" style="color:#ff007f;">GAME OVER</div>
        <div id="gameover-mode-label" class="main-title" style="font-size:22px; color:#fff;">FINAL SCORE</div>
        <div id="gameover-score-val" class="gameover-val">0</div>
        <div id="gameover-best-tag" class="hi-score-tag">ALL-TIME BEST: 0</div>
        <button id="btn-restart" class="action-btn">PLAY AGAIN</button>
        <button id="btn-to-menu" class="sub-action-btn">RETURN TO MENU</button>
      </div>
    </div>
  </div>

  <script>
    // --- SYNTHESIZED 8-BIT AUDIO (With Mute Support) ---
    let audioCtx = null;
    let isMuted = false;

    function playTone(freq, type = 'sine', duration = 0.08, vol = 0.1) {
      if (isMuted) return;
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const sndHit = (f = 460) => playTone(f, 'triangle', 0.05, 0.12);
    const sndPaddle = () => playTone(380, 'sine', 0.08, 0.15);
    const sndLaser = () => playTone(920, 'sawtooth', 0.09, 0.08);
    const sndPower = () => playTone(780, 'square', 0.16, 0.1);
    const sndBomb = () => playTone(110, 'sawtooth', 0.35, 0.25);
    const sndDie = () => playTone(140, 'sawtooth', 0.4, 0.15);

    // --- DOM REFERENCES ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const gameoverScreen = document.getElementById('gameover-screen');
    const hudScore = document.getElementById('hud-score');
    const hudBest = document.getElementById('hud-best');
    const hudMode = document.getElementById('hud-mode');
    const hudCenter = document.getElementById('hud-center');
    const hudMuteBtn = document.getElementById('hud-mute-btn');
    const hudSpeedBtn = document.getElementById('hud-speed-btn');
    const hudMenuBtn = document.getElementById('hud-menu-btn');
    const gameoverScoreVal = document.getElementById('gameover-score-val');
    const gameoverModeLabel = document.getElementById('gameover-mode-label');
    const gameoverBestTag = document.getElementById('gameover-best-tag');

    const W = 460;
    const H = 700;

    let gameState = 'MENU';
    let score = 0;
    let hiScore = parseInt(localStorage.getItem('sbc_neon_hiscore') || '0', 10);
    hudBest.textContent = hiScore;

    let particles = [];
    let popups = [];

    // Screen Shake state
    let shakeTimer = 0;
    let shakeMag = 0;

    function triggerShake(magnitude = 6, duration = 12) {
      shakeMag = magnitude;
      shakeTimer = duration;
    }

    function addPopup(x, y, text, color = '#00f0ff') {
      popups.push({
        x: x,
        y: y,
        text: text,
        color: color,
        life: 1.0,
        vy: -1.6
      });
    }

    // =====================================
    // 1. CLASSIC RETRO ENGINE
    // =====================================
    const retro = {
      lives: 3,
      level: 1,
      paddle: { w: 85, h: 12, x: 187, y: 655, hasLasers: false },
      balls: [],
      bricks: [],
      powerUps: [],
      lasers: []
    };

    function startRetro() {
      gameState = 'PLAYING_RETRO';
      hudMode.textContent = 'RETRO';
      hudSpeedBtn.style.display = 'none';
      score = 0;
      retro.lives = 3;
      retro.level = 1;
      hudScore.textContent = score;
      hudCenter.innerHTML = `LIVES: <span style="color:#ff007f;">❤️❤️❤️</span>`;
      initRetroBricks();
      resetRetroBall();
      overlay.style.display = 'none';
      gameoverScreen.style.display = 'none';
    }

    function initRetroBricks() {
      retro.bricks = [];
      const cols = 7, rows = 6;
      const pad = 6;
      const bW = (W - (pad * (cols + 1))) / cols;
      const bH = 16;
      const colors = ['#ff007f', '#ff5500', '#ffe600', '#39ff14', '#00f0ff', '#b026ff'];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          retro.bricks.push({
            x: pad + c * (bW + pad),
            y: 40 + r * (bH + pad),
            w: bW,
            h: bH,
            color: colors[r % colors.length],
            hp: (retro.level >= 2 && r === 0) ? 2 : 1,
            alive: true
          });
        }
      }
    }

    function resetRetroBall() {
      retro.paddle.w = 85;
      retro.paddle.hasLasers = false;
      retro.paddle.x = (W - 85) / 2;
      retro.balls = [{
        x: W / 2,
        y: H - 55,
        vx: 3.5 * (Math.random() > 0.5 ? 1 : -1),
        vy: -5,
        r: 6,
        stuck: true,
        trail: []
      }];
    }

    // =====================================
    // 2. MODERN SWARM ENGINE (Micro-Bricks)
    // =====================================
    const SWARM_COLS = 16; 
    const SWARM_PAD = 3;
    const SWARM_BW = (W - (SWARM_PAD * (SWARM_COLS + 1))) / SWARM_COLS;
    const SWARM_BH = 17;

    const swarm = {
      level: 1,
      ballCount: 5,
      balls: [],
      bricks: [],
      pickups: [],
      shooter: { x: W / 2, y: H - 30 },
      aiming: false,
      aimAngle: -Math.PI / 2,
      launching: false,
      launchTimer: 0,
      launchedCount: 0,
      ballsReturned: 0,
      newShooterX: null,
      speed: 1
    };

    function startSwarm() {
      gameState = 'PLAYING_SWARM';
      hudMode.textContent = 'SWARM';
      hudSpeedBtn.style.display = 'block';
      hudSpeedBtn.textContent = '1X';
      swarm.speed = 1;
      score = 0;
      swarm.level = 1;
      swarm.ballCount = 5;
      swarm.balls = [];
      swarm.shooter.x = W / 2;
      swarm.shooter.y = H - 30;
      swarm.aiming = false;
      swarm.launching = false;
      hudScore.textContent = score;
      hudCenter.innerHTML = `BALLS: <span class="hud-accent">${swarm.ballCount}</span>`;
      swarm.bricks = [];
      swarm.pickups = [];

      for (let i = 0; i < 5; i++) {
        addSwarmWave();
      }

      overlay.style.display = 'none';
      gameoverScreen.style.display = 'none';
    }

    function addSwarmWave() {
      for (let b of swarm.bricks) b.row++;
      for (let p of swarm.pickups) p.row++;

      let spawnedPickup = false;

      for (let c = 0; c < SWARM_COLS; c++) {
        const rand = Math.random();
        if (rand < 0.46) {
          let hp = 1;
          if (swarm.level === 1) {
            hp = Math.random() < 0.35 ? 2 : 1;
          } else {
            hp = Math.max(1, Math.round(swarm.level * (0.8 + Math.random() * 1.2)));
          }

          const isTNT = Math.random() < 0.08;
          swarm.bricks.push({
            c: c,
            row: 1,
            w: SWARM_BW,
            h: SWARM_BH,
            hp: hp,
            maxHp: hp,
            isTNT: isTNT,
            alive: true
          });
        } else if (!spawnedPickup && rand < 0.52) {
          spawnedPickup = true;
          swarm.pickups.push({
            c: c,
            row: 1,
            w: SWARM_BW,
            h: SWARM_BH,
            collected: false
          });
        }
      }
    }

    function getBrickColors(hp, isTNT) {
      if (isTNT) return { fill: '#ff4400', border: '#ffaa00', text: '#fff' };
      if (hp <= 2) return { fill: '#0a1d37', border: '#00f0ff', text: '#00f0ff' };
      if (hp <= 6) return { fill: '#0b2b26', border: '#39ff14', text: '#39ff14' };
      if (hp <= 14) return { fill: '#332a05', border: '#ffe600', text: '#ffe600' };
      if (hp <= 28) return { fill: '#331122', border: '#ff007f', text: '#ff007f' };
      return { fill: '#280d38', border: '#b026ff', text: '#b026ff' };
    }

    // =====================================
    // PARTICLES (Sparks)
    // =====================================
    function spawnSparks(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          r: Math.random() * 2 + 1,
          color: color,
          life: 1
        });
      }
    }

    // =====================================
    // TOUCH & POINTER INPUTS
    // =====================================
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      let cx = e.clientX;
      let cy = e.clientY;
      if (e.touches && e.touches.length > 0) {
        cx = e.touches[0].clientX;
        cy = e.touches[0].clientY;
      }
      return {
        x: (cx - rect.left) * scaleX,
        y: (cy - rect.top) * scaleY
      };
    }

    function updateAimAngle(pt) {
      const dx = pt.x - swarm.shooter.x;
      const dy = pt.y - swarm.shooter.y;
      if (dy < -12) {
        let angle = Math.atan2(dy, dx);
        angle = Math.max(-Math.PI * 0.96, Math.min(-Math.PI * 0.04, angle));
        swarm.aimAngle = angle;
        swarm.aiming = true;
      }
    }

    function onPointerDown(e) {
      if (gameState === 'MENU') return;
      const pt = getCanvasCoords(e);

      if (gameState === 'PLAYING_RETRO') {
        retro.paddle.x = Math.max(0, Math.min(W - retro.paddle.w, pt.x - retro.paddle.w / 2));
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].stuck = false;
          sndPaddle();
        }
        if (retro.paddle.hasLasers) {
          sndLaser();
          retro.lasers.push({ x: retro.paddle.x + 8, y: retro.paddle.y - 4, vy: -9 });
          retro.lasers.push({ x: retro.paddle.x + retro.paddle.w - 8, y: retro.paddle.y - 4, vy: -9 });
        }
      } else if (gameState === 'PLAYING_SWARM') {
        if (!swarm.launching) {
          updateAimAngle(pt);
        }
      }
    }

    function onPointerMove(e) {
      if (gameState === 'MENU') return;
      const pt = getCanvasCoords(e);

      if (gameState === 'PLAYING_RETRO') {
        retro.paddle.x = Math.max(0, Math.min(W - retro.paddle.w, pt.x - retro.paddle.w / 2));
        if (retro.balls[0] && retro.balls[0].stuck) {
          retro.balls[0].x = retro.paddle.x + retro.paddle.w / 2;
        }
      } else if (gameState === 'PLAYING_SWARM') {
        if (!swarm.launching && swarm.aiming) {
          updateAimAngle(pt);
        }
      }
    }

    function onPointerUp() {
      if (gameState === 'PLAYING_SWARM') {
        if (swarm.aiming && !swarm.launching) {
          swarm.aiming = false;
          swarm.launching = true;
          swarm.launchedCount = 0;
          swarm.ballsReturned = 0;
          swarm.launchTimer = 0;
          swarm.balls = [];
          swarm.newShooterX = null;
        }
      }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      onPointerDown(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      onPointerMove(e);
    }, { passive: false });

    window.addEventListener('touchend', () => {
      onPointerUp();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (gameState === 'PLAYING_RETRO') {
          if (retro.balls[0] && retro.balls[0].stuck) {
            retro.balls[0].stuck = false;
            sndPaddle();
          }
          if (retro.paddle.hasLasers) {
            sndLaser();
            retro.lasers.push({ x: retro.paddle.x + 8, y: retro.paddle.y - 4, vy: -9 });
            retro.lasers.push({ x: retro.paddle.x + retro.paddle.w - 8, y: retro.paddle.y - 4, vy: -9 });
          }
        }
      }
      if (gameState === 'PLAYING_RETRO') {
        if (e.code === 'ArrowLeft') retro.paddle.x = Math.max(0, retro.paddle.x - 32);
        if (e.code === 'ArrowRight') retro.paddle.x = Math.min(W - retro.paddle.w, retro.paddle.x + 32);
      }
    });

    // Mute Button Toggle
    hudMuteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      hudMuteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    // Speed button for Swarm
    hudSpeedBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      swarm.speed = swarm.speed === 1 ? 2 : (swarm.speed === 2 ? 3 : 1);
      hudSpeedBtn.textContent = swarm.speed + 'X';
    });

    function showGameOver(modeTitle) {
      gameState = 'MENU';
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem('sbc_neon_hiscore', hiScore);
        hudBest.textContent = hiScore;
      }
      gameoverModeLabel.textContent = `${modeTitle} GAME OVER`;
      gameoverScoreVal.textContent = score;
      gameoverBestTag.textContent = `ALL-TIME BEST: ${hiScore}`;
      gameoverScreen.style.display = 'flex';
    }

    // =====================================
    // RETRO GAMEPLAY UPDATE
    // =====================================
    function updateRetroEngine() {
      retro.paddle.y = H - 28;

      for (let i = retro.lasers.length - 1; i >= 0; i--) {
        const l = retro.lasers[i];
        l.y += l.vy;
        if (l.y < 0) { retro.lasers.splice(i, 1); continue; }
        for (let b of retro.bricks) {
          if (b.alive && l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
            b.hp--;
            if (b.hp <= 0) {
              b.alive = false;
              score += 20;
              spawnSparks(b.x + b.w / 2, b.y + b.h / 2, b.color);
              addPopup(b.x + b.w / 2, b.y, '+20', '#ff007f');
            }
            sndHit(750);
            retro.lasers.splice(i, 1);
            break;
          }
        }
      }

      for (let i = retro.balls.length - 1; i >= 0; i--) {
        const b = retro.balls[i];
        if (b.stuck) continue;

        // Trail record
        if (!b.trail) b.trail = [];
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 5) b.trail.shift();

        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.r < 0 || b.x + b.r > W) { b.vx *= -1; sndHit(300); }
        if (b.y - b.r < 0) { b.vy *= -1; sndHit(300); }

        if (b.y + b.r >= retro.paddle.y && b.y - b.r <= retro.paddle.y + retro.paddle.h && b.x >= retro.paddle.x && b.x <= retro.paddle.x + retro.paddle.w && b.vy > 0) {
          sndPaddle();
          const hit = (b.x - (retro.paddle.x + retro.paddle.w / 2)) / (retro.paddle.w / 2);
          const spd = Math.hypot(b.vx, b.vy);
          b.vx = hit * 6;
          b.vy = -Math.abs(Math.sqrt(Math.max(16, spd * spd - b.vx * b.vx)));
          b.y = retro.paddle.y - b.r;
        }

        for (let brk of retro.bricks) {
          if (!brk.alive) continue;
          if (b.x + b.r > brk.x && b.x - b.r < brk.x + brk.w && b.y + b.r > brk.y && b.y - b.r < brk.y + brk.h) {
            brk.hp--;
            if (brk.hp <= 0) {
              brk.alive = false;
              score += 15;
              spawnSparks(brk.x + brk.w / 2, brk.y + brk.h / 2, brk.color);
              addPopup(brk.x + brk.w / 2, brk.y, '+15', '#00f0ff');
              if (Math.random() < 0.22) {
                const types = ['MULTI', 'LASER', 'WIDE'];
                retro.powerUps.push({
                  x: brk.x + brk.w / 2,
                  y: brk.y + brk.h / 2,
                  type: types[Math.floor(Math.random() * types.length)],
                  vy: 2.2
                });
              }
            }
            sndHit(520);
            b.vy *= -1;
            break;
          }
        }

        if (b.y - b.r > H) retro.balls.splice(i, 1);
      }

      if (retro.balls.length === 0) {
        retro.lives--;
        sndDie();
        triggerShake(8, 14);
        if (retro.lives <= 0) {
          showGameOver('CLASSIC RETRO');
          return;
        } else {
          let str = '';
          for (let l = 0; l < retro.lives; l++) str += '❤️';
          hudCenter.innerHTML = `LIVES: <span style="color:#ff007f;">${str}</span>`;
          resetRetroBall();
        }
      }

      for (let i = retro.powerUps.length - 1; i >= 0; i--) {
        const p = retro.powerUps[i];
        p.y += p.vy;
        if (p.y >= retro.paddle.y && p.y <= retro.paddle.y + retro.paddle.h && p.x >= retro.paddle.x && p.x <= retro.paddle.x + retro.paddle.w) {
          sndPower();
          if (p.type === 'WIDE') {
            retro.paddle.w = 125;
            setTimeout(() => { retro.paddle.w = 85; }, 9000);
            addPopup(p.x, p.y - 10, 'WIDE PADDLE', '#ffe600');
          } else if (p.type === 'LASER') {
            retro.paddle.hasLasers = true;
            addPopup(p.x, p.y - 10, 'LASERS ACTIVE', '#ff007f');
          } else if (p.type === 'MULTI' && retro.balls[0]) {
            retro.balls.push({ x: retro.balls[0].x, y: retro.balls[0].y, vx: -3, vy: -4, r: 6, stuck: false, trail: [] });
            retro.balls.push({ x: retro.balls[0].x, y: retro.balls[0].y, vx: 3, vy: -4, r: 6, stuck: false, trail: [] });
            addPopup(p.x, p.y - 10, 'MULTIBALL', '#39ff14');
          }
          retro.powerUps.splice(i, 1);
        } else if (p.y > H) retro.powerUps.splice(i, 1);
      }

      if (retro.bricks.length > 0 && retro.bricks.every(b => !b.alive)) {
        retro.level++;
        triggerShake(5, 10);
        addPopup(W / 2, H / 2, 'LEVEL CLEAR!', '#39ff14');
        initRetroBricks();
        resetRetroBall();
      }

      hudScore.textContent = score;
    }

    // =====================================
    // SWARM UPDATE (With Shake & Popups)
    // =====================================
    function updateSwarmEngine() {
      if (swarm.launching && swarm.launchedCount < swarm.ballCount) {
        swarm.launchTimer++;
        if (swarm.launchTimer % 3 === 0) {
          const spd = 8.5;
          swarm.balls.push({
            x: swarm.shooter.x,
            y: swarm.shooter.y,
            vx: Math.cos(swarm.aimAngle) * spd,
            vy: Math.sin(swarm.aimAngle) * spd,
            r: 3.5,
            trail: []
          });
          swarm.launchedCount++;
        }
      }

      for (let s = 0; s < swarm.speed; s++) {
        for (let i = swarm.balls.length - 1; i >= 0; i--) {
          const b = swarm.balls[i];

          // Comet Trail
          if (!b.trail) b.trail = [];
          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 4) b.trail.shift();

          b.x += b.vx;
          b.y += b.vy;

          if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; }
          if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; }
          if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; }

          for (let brk of swarm.bricks) {
            if (!brk.alive) continue;
            const bx = SWARM_PAD + brk.c * (SWARM_BW + SWARM_PAD);
            const by = 40 + brk.row * (SWARM_BH + SWARM_PAD);

            if (b.x + b.r > bx && b.x - b.r < bx + SWARM_BW && b.y + b.r > by && b.y - b.r < by + SWARM_BH) {
              brk.hp--;
              score++;
              sndHit(450 + Math.min(300, brk.hp * 8));

              // TNT Cluster Detonation + Screen Shake!
              if (brk.isTNT && brk.hp <= 0) {
                sndBomb();
                triggerShake(10, 16);
                spawnSparks(bx + SWARM_BW / 2, by + SWARM_BH / 2, '#ff5500', 35);
                addPopup(bx + SWARM_BW / 2, by, 'BOOM!', '#ffaa00');

                for (let other of swarm.bricks) {
                  if (other.alive && Math.abs(other.c - brk.c) <= 1 && Math.abs(other.row - brk.row) <= 1) {
                    other.hp -= 20;
                    if (other.hp <= 0) other.alive = false;
                  }
                }
              }

              if (brk.hp <= 0) {
                brk.alive = false;
                spawnSparks(bx + SWARM_BW / 2, by + SWARM_BH / 2, '#00f0ff', 8);
              }
              b.vy *= -1;
              break;
            }
          }

          for (let p of swarm.pickups) {
            if (p.collected) continue;
            const px = SWARM_PAD + p.c * (SWARM_BW + SWARM_PAD) + SWARM_BW / 2;
            const py = 40 + p.row * (SWARM_BH + SWARM_PAD) + SWARM_BH / 2;
            if (Math.hypot(b.x - px, b.y - py) < 12) {
              p.collected = true;
              swarm.ballCount++;
              sndPower();
              spawnSparks(px, py, '#39ff14', 8);
              addPopup(px, py - 6, '+1 BALL', '#39ff14');
            }
          }

          if (b.y + b.r >= H - 15) {
            if (swarm.newShooterX === null) swarm.newShooterX = b.x;
            swarm.balls.splice(i, 1);
            swarm.ballsReturned++;
          }
        }
      }

      if (swarm.launching && swarm.ballsReturned >= swarm.ballCount) {
        swarm.launching = false;
        swarm.shooter.x = Math.max(25, Math.min(W - 25, swarm.newShooterX || W / 2));
        swarm.level++;
        addSwarmWave();
        hudCenter.innerHTML = `BALLS: <span class="hud-accent">${swarm.ballCount}</span>`;

        for (let b of swarm.bricks) {
          if (b.alive && b.row >= 26) {
            triggerShake(12, 20);
            showGameOver('MODERN SWARM');
            return;
          }
        }
      }

      hudScore.textContent = score;
    }

    // =====================================
    // DRAW RENDER LOOP (Screen Shake & Trails)
    // =====================================
    function draw() {
      ctx.save();

      // Screen Shake
      if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeMag;
        const sy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(sx, sy);
        shakeTimer--;
      }

      ctx.clearRect(0, 0, W, H);

      if (gameState === 'PLAYING_RETRO') {
        for (let b of retro.bricks) {
          if (!b.alive) continue;
          ctx.fillStyle = b.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = b.color;
          ctx.fillRect(b.x, b.y, b.w, b.h);
        }
        ctx.shadowBlur = 0;

        ctx.fillStyle = retro.paddle.hasLasers ? '#ff007f' : '#00f0ff';
        ctx.shadowBlur = 14;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillRect(retro.paddle.x, retro.paddle.y, retro.paddle.w, retro.paddle.h);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ff007f';
        for (let l of retro.lasers) ctx.fillRect(l.x, l.y, 4, 10);

        for (let p of retro.powerUps) {
          ctx.fillStyle = p.type === 'LASER' ? '#ff007f' : (p.type === 'MULTI' ? '#39ff14' : '#ffe600');
          ctx.beginPath();
          ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#060810';
          ctx.font = 'bold 9px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.type[0], p.x, p.y);
        }

        // Draw Retro Balls & Comet Trails
        for (let b of retro.balls) {
          if (b.trail) {
            for (let t = 0; t < b.trail.length; t++) {
              const alpha = (t + 1) / b.trail.length * 0.45;
              ctx.fillStyle = `rgba(255, 230, 0, ${alpha})`;
              ctx.beginPath();
              ctx.arc(b.trail[t].x, b.trail[t].y, b.r * 0.7, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.fillStyle = '#ffe600';
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#ffe600';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        updateRetroEngine();

      } else if (gameState === 'PLAYING_SWARM') {
        for (let b of swarm.bricks) {
          if (!b.alive) continue;
          const bx = SWARM_PAD + b.c * (SWARM_BW + SWARM_PAD);
          const by = 40 + b.row * (SWARM_BH + SWARM_PAD);
          const cStyle = getBrickColors(b.hp, b.isTNT);

          ctx.fillStyle = cStyle.fill;
          ctx.strokeStyle = cStyle.border;
          ctx.lineWidth = 1.4;
          ctx.shadowBlur = 6;
          ctx.shadowColor = cStyle.border;
          ctx.fillRect(bx, by, SWARM_BW, SWARM_BH);
          ctx.strokeRect(bx, by, SWARM_BW, SWARM_BH);
          ctx.shadowBlur = 0;

          ctx.fillStyle = cStyle.text;
          if (b.isTNT) {
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💣', bx + SWARM_BW / 2, by + SWARM_BH / 2);
          } else {
            ctx.font = 'bold 8.5px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.hp, bx + SWARM_BW / 2, by + SWARM_BH / 2);
          }
        }

        for (let p of swarm.pickups) {
          if (p.collected) continue;
          const px = SWARM_PAD + p.c * (SWARM_BW + SWARM_PAD) + SWARM_BW / 2;
          const py = 40 + p.row * (SWARM_BH + SWARM_PAD) + SWARM_BH / 2;
          ctx.fillStyle = '#39ff14';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#39ff14';
          ctx.beginPath();
          ctx.arc(px, py, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#060810';
          ctx.font = 'bold 8px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('+', px, py);
        }

        // Bouncing Aim Trajectory Line
        if (swarm.aiming && !swarm.launching) {
          let curX = swarm.shooter.x;
          let curY = swarm.shooter.y;
          let dirX = Math.cos(swarm.aimAngle);
          let dirY = Math.sin(swarm.aimAngle);
          const ballR = 3.5;
          let totalDist = 520;

          ctx.strokeStyle = '#00f0ff';
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#00f0ff';
          ctx.setLineDash([5, 5]);
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(curX, curY);

          for (let bounce = 0; bounce < 2; bounce++) {
            let hitT = totalDist;
            let hitWall = 'NONE';

            if (dirX < 0) {
              const t = (ballR - curX) / dirX;
              if (t > 0 && t < hitT) { hitT = t; hitWall = 'X'; }
            } else if (dirX > 0) {
              const t = (W - ballR - curX) / dirX;
              if (t > 0 && t < hitT) { hitT = t; hitWall = 'X'; }
            }

            if (dirY < 0) {
              const t = (ballR - curY) / dirY;
              if (t > 0 && t < hitT) { hitT = t; hitWall = 'Y'; }
            }

            const nextX = curX + dirX * hitT;
            const nextY = curY + dirY * hitT;
            ctx.lineTo(nextX, nextY);

            if (hitWall === 'X') {
              curX = nextX;
              curY = nextY;
              dirX = -dirX;
              totalDist -= hitT;
            } else {
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(nextX, nextY, 4, 0, Math.PI * 2);
              ctx.fillStyle = '#00f0ff';
              ctx.fill();
              break;
            }
          }

          ctx.stroke();
          ctx.setLineDash([]);
          ctx.shadowBlur = 0;
        }

        // Shooter
        ctx.fillStyle = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00f0ff';
        ctx.beginPath();
        ctx.arc(swarm.shooter.x, swarm.shooter.y, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Swarm Balls & Comet Trails
        for (let b of swarm.balls) {
          if (b.trail) {
            for (let t = 0; t < b.trail.length; t++) {
              const alpha = (t + 1) / b.trail.length * 0.4;
              ctx.fillStyle = `rgba(0, 240, 255, ${alpha})`;
              ctx.beginPath();
              ctx.arc(b.trail[t].x, b.trail[t].y, b.r * 0.65, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.fillStyle = '#00f0ff';
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#00f0ff';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        updateSwarmEngine();
      }

      // Draw Floating Text Popups (+15, +20, BOOM!)
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y += pop.vy;
        pop.life -= 0.025;
        if (pop.life <= 0) {
          popups.splice(i, 1);
          continue;
        }
        ctx.fillStyle = pop.color;
        ctx.globalAlpha = Math.max(0, pop.life);
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(pop.text, pop.x, pop.y);
      }
      ctx.globalAlpha = 1;

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.restore();

      requestAnimationFrame(draw);
    }

    // =====================================
    // BUTTON HOOKS
    // =====================================
    document.getElementById('btn-retro').addEventListener('click', () => {
      startRetro();
    });

    document.getElementById('btn-swarm').addEventListener('click', () => {
      startSwarm();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      if (hudMode.textContent === 'RETRO') startRetro();
      else startSwarm();
    });

    document.getElementById('btn-to-menu').addEventListener('click', () => {
      gameoverScreen.style.display = 'none';
      overlay.style.display = 'flex';
      gameState = 'MENU';
    });

    hudMenuBtn.addEventListener('click', () => {
      gameState = 'MENU';
      gameoverScreen.style.display = 'none';
      overlay.style.display = 'flex';
    });

    draw();
  </script>
